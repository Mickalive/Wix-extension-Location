name: CI

'on':
  push:
    branches: ["main", "lab/wix-rules"]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: wix-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAIN_PROMPT_SHA256: 9cdd0500552998adedbae7e2cc7605ca443187393b6299f0bf4ffdcba18c9101
  CI: "true"

jobs:
  checks:
    name: Accepted-state deterministic gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify constitution, immutable roles and orchestration invariants
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  MAIN_PROMPT.md\n' "$MAIN_PROMPT_SHA256" | sha256sum --check --strict
          sha256sum --check .opencode/job-descriptions/MANIFEST.sha256
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |f| YAML.load_file(f); puts "valid yaml: #{f}" }'
          bash -n .github/scripts/wix-factory-cycle.sh

          # Protocol v4 deliberately has one critical cycle runner and no lane DAG/matrix.
          if grep -Eq '^[[:space:]]+(matrix|strategy):' .github/workflows/wix-build-loop.yml; then
            echo "::error::Factory protocol v4 must not reintroduce a matrix/strategy lane DAG."
            exit 1
          fi

          # These files implemented retired parallel/retry state machines and must not return.
          retired="$(find .github/scripts -maxdepth 1 -type f \
            \( -name 'wix-v2-*' -o -name 'recover-transient-opencode.sh' -o -name 'run-opencode-with-retry.sh' \) -print)"
          if [[ -n "$retired" ]]; then
            echo "::error::Retired orchestration scripts reappeared:"
            printf '%s\n' "$retired"
            exit 1
          fi

          grep -q 'CONTROL_PROTOCOL: "4"' .github/workflows/wix-build-loop.yml
          grep -q 'CONTROL_PROTOCOL: "4"' .github/workflows/wix-watchdog.yml

      - name: Set up Node
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0

      - name: Run strongest available deterministic checks
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package-lock.json ]]; then
            echo "No product package-lock yet; governance checks passed."
            exit 0
          fi
          npm ci --ignore-scripts --no-audit --no-fund
          if node -e 'const p=require("./package.json"); process.exit(p.scripts?.test?0:1)' >/dev/null 2>&1; then npm test; fi
          if node -e 'const p=require("./package.json"); process.exit(p.scripts?.typecheck?0:1)' >/dev/null 2>&1; then npm run typecheck; fi
          if node -e 'const p=require("./package.json"); process.exit(p.scripts?.build?0:1)' >/dev/null 2>&1; then npm run build; fi
