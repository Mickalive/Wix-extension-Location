name: CI

'on':
  push:
    branches: ["main", "lab/wix-rules"]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: wix-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAIN_PROMPT_SHA256: 9cdd0500552998adedbae7e2cc7605ca443187393b6299f0bf4ffdcba18c9101
  CI: "true"

jobs:
  checks:
    name: Architecture and deterministic product gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify authoritative lane-machine architecture
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  MAIN_PROMPT.md\n' "$MAIN_PROMPT_SHA256" | sha256sum --check --strict
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |f| YAML.load_file(f); puts "valid yaml: #{f}" }'
          bash -n .github/scripts/wix-factory-cycle.sh
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 3
          test "$(find .github/scripts -maxdepth 1 -type f | wc -l)" -eq 1
          jq -e '.architecture=="lane-machine/1" and .generation>=1 and .accepted_base and .phase' .factory/state.json >/dev/null
          grep -Fq 'wix-product-factory-authoritative' .github/workflows/wix-build-loop.yml
          grep -Fq "cron: '*/5 * * * *'" .github/workflows/wix-watchdog.yml
          for f in integration-auditor rules-auditor dashboard-auditor billing-auditor integrated-auditor wix-live-auditor release-readiness-auditor; do test -f ".opencode/agents/$f.md"; done
          ! test -f .opencode/agents/lane-auditor.md
          ! test -f .opencode/agents/wix-simulation-auditor.md

      - name: Set up Node
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0

      - name: Run strongest available deterministic product checks
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package-lock.json ]]; then exit 0; fi
          npm ci --ignore-scripts --no-audit --no-fund
          if node -e 'const p=require("./package.json"); process.exit(p.scripts?.check?0:1)' >/dev/null 2>&1; then npm run check; fi
          if node -e 'const p=require("./package.json"); process.exit(p.scripts?.test?0:1)' >/dev/null 2>&1; then npm test; fi
          if node -e 'const p=require("./package.json"); process.exit(p.scripts?.typecheck?0:1)' >/dev/null 2>&1; then npm run typecheck; fi
          if node -e 'const p=require("./package.json"); process.exit(p.scripts?.build?0:1)' >/dev/null 2>&1; then npm run build; fi
