name: CI

on:
  push:
    branches:
      - lab/wix-rules
  pull_request:

permissions:
  contents: read

concurrency:
  group: wix-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAIN_PROMPT_SHA256: 9cdd0500552998adedbae7e2cc7605ca443187393b6299f0bf4ffdcba18c9101
  CI: "true"

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify product constitution
        shell: bash
        run: printf '%s  MAIN_PROMPT.md\n' "$MAIN_PROMPT_SHA256" | sha256sum --check --strict
      - name: Parse workflow YAML
        shell: bash
        run: ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |f| YAML.load_file(f); puts "valid yaml: #{f}" }'
      - name: Set up Node
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0
      - name: Install dependencies
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit tests
        if: ${{ hashFiles('package-lock.json') != '' }}
        shell: bash
        run: |
          if node -e 'const p=require("./package.json"); process.exit(p.scripts?.test?0:1)' >/dev/null 2>&1; then npm test; fi
      - name: Typecheck
        if: ${{ hashFiles('package-lock.json') != '' }}
        shell: bash
        run: |
          if node -e 'const p=require("./package.json"); process.exit(p.scripts?.typecheck?0:1)' >/dev/null 2>&1; then npm run typecheck; fi
      - name: Build
        if: ${{ hashFiles('package-lock.json') != '' }}
        shell: bash
        run: |
          if node -e 'const p=require("./package.json"); process.exit(p.scripts?.build?0:1)' >/dev/null 2>&1; then npm run build; fi
