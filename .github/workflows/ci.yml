name: CI

'on':
  workflow_dispatch: {}
  push:
    branches: ["main"]
    paths:
      - ".github/**"
      - ".opencode/**"
      - "AGENTS.md"
      - "MAIN_PROMPT.md"
      - "opencode.json"
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: wix-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAIN_PROMPT_SHA256: 9cdd0500552998adedbae7e2cc7605ca443187393b6299f0bf4ffdcba18c9101
  CI: "true"

jobs:
  checks:
    name: Control architecture + accepted-product deterministic gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout control plane
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify authoritative architecture
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  MAIN_PROMPT.md\n' "$MAIN_PROMPT_SHA256" | sha256sum --check --strict
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |f| YAML.load_file(f); puts "valid yaml: #{f}" }'
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 2
          test ! -f .github/workflows/wix-watchdog.yml
          for f in wix-factory-cycle.sh wix-official-scaffold.sh wix-env-preflight.sh probe-model.sh probe-and-select-models.sh select-models.sh housekeeping.sh; do
            bash -n ".github/scripts/$f"
          done
          test "$(find .github/scripts -maxdepth 1 -type f | wc -l)" -eq 7
          jq -e '.architecture=="lane-machine/1" and .generation>=1 and .accepted_base and .phase' .factory/state.json >/dev/null
          grep -Fq "cron: '*/15 * * * *'" .github/workflows/wix-build-loop.yml
          grep -Fq 'group: wix-product-factory-' .github/workflows/wix-build-loop.yml
          grep -Fq 'Stagnation guard:' .github/workflows/wix-build-loop.yml
          grep -Fq 'continue-on-error: true' .github/workflows/wix-build-loop.yml
          grep -Fq 'x-preview-f-free' .github/scripts/probe-and-select-models.sh
          grep -Fq 'WIX_CLIENT_ID' .github/scripts/wix-env-preflight.sh
          grep -Fq 'WIX_MCP_READY' .github/scripts/wix-env-preflight.sh
          grep -Fq '@wix/mcp@1.0.72' .github/scripts/wix-env-preflight.sh
          grep -Fq 'blocked_resume_phase' .github/scripts/wix-factory-cycle.sh
          grep -Fq 'gate_proofs' .github/scripts/wix-factory-cycle.sh
          grep -Fq 'deterministic_checks' .github/scripts/wix-factory-cycle.sh
          grep -Fq 'wix_build_check' .github/scripts/wix-factory-cycle.sh
          grep -Fq 'OFFICIAL_WIX_SCAFFOLD_REBASE_REQUIRED' .github/scripts/wix-factory-cycle.sh
          grep -Fq -- '--extend-app-id "$EXPECTED_WIX_APP_ID"' .github/scripts/wix-official-scaffold.sh
          grep -Fq 'schemaVersion:2' .github/scripts/select-models.sh
          grep -Fq 'responsiveThresholdSeconds:30' .github/scripts/select-models.sh
          grep -Fq 'force-cancel' .github/scripts/housekeeping.sh
          test -f .opencode/agents/model-probe.md
          for f in integration-auditor rules-auditor dashboard-auditor billing-auditor integrated-auditor wix-live-auditor release-readiness-auditor; do
            test -f ".opencode/agents/$f.md"
          done
          test ! -f .opencode/agents/lane-auditor.md
          test ! -f .opencode/agents/wix-simulation-auditor.md
          test ! -f .opencode/job-descriptions/lane-auditor.md
          test ! -f .opencode/job-descriptions/wix-simulation-auditor.md
          sha256sum --check --strict .opencode/job-descriptions/MANIFEST.sha256

      - name: Set up Node
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.19.0

      - name: Verify exact accepted product, not main
        shell: bash
        run: |
          set -euo pipefail
          accepted="$(jq -r '.accepted_base' .factory/state.json)"
          git fetch --no-tags origin "+refs/heads/lab/wix-rules:refs/remotes/origin/lab/wix-rules"
          remote="$(git rev-parse refs/remotes/origin/lab/wix-rules)"
          [[ "$remote" == "$accepted" ]] || { echo "::error::Canonical accepted_base $accepted differs from lab/wix-rules $remote"; exit 1; }
          product="${RUNNER_TEMP}/accepted-product"
          git worktree add --detach "$product" "$accepted"
          (
            cd "$product"
            test -f package-lock.json
            npm ci --ignore-scripts --no-audit --no-fund
            # CI is intentionally credential-free. The real Wix build is proven
            # in WIX_QA and re-run immediately before READY promotion.
            npm run check
          )
          git worktree remove --force "$product"
          git worktree prune
