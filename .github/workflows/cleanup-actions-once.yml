name: One-shot Actions cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-actions-once.yml"

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete obsolete completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          json=$(gh api "repos/$repo/actions/runs?per_page=100")

          keep_file=$(mktemp)
          jq -r '.workflow_runs[] | select(.status != "completed") | .id' <<<"$json" > "$keep_file"
          printf '%s\n' 32686475370 32692407760 >> "$keep_file"

          for name in "CI" "Wix Platform Recon" "Wix Autonomous Product Factory" "Wix Autonomous Launch Bridge"; do
            jq -r --arg n "$name" '[.workflow_runs[] | select(.status == "completed" and .name == $n)] | sort_by(.created_at) | last | .id // empty' <<<"$json" >> "$keep_file"
          done
          sort -u "$keep_file" -o "$keep_file"

          deleted=0
          kept=0
          while IFS=$'\t' read -r id status name; do
            if [[ "$status" != completed ]] || grep -qx "$id" "$keep_file"; then
              kept=$((kept+1))
              continue
            fi
            gh api --method DELETE "repos/$repo/actions/runs/$id"
            deleted=$((deleted+1))
          done < <(jq -r '.workflow_runs[] | [.id,.status,.name] | @tsv' <<<"$json")

          echo "Deleted obsolete completed runs: $deleted"
          echo "Preserved active/current/latest useful runs: $kept"
          gh issue comment 1 --repo "$repo" --body "### Actions cleanup 2026-08-24\nDeleted **$deleted** obsolete completed run(s). Preserved **$kept** active/current/latest useful run(s), including recon **32686475370** and product run **32692407760**."

# verified cleanup trigger
