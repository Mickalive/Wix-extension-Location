name: Complete Wix App Metadata Once

on:
  push:
    branches: [factory/real-wix-finalization]
    paths: [.complete-wix-metadata]

permissions:
  contents: read

concurrency:
  group: complete-wix-app-metadata-once
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_ID: 3e9ec3af-001b-4684-a197-a5133677844d
      WIX_CLI_VERSION: 1.1.238
      CREATE_NEW_VERSION: 0.0.108
      DESIRED_NAMESPACE: advanced-booking-rules
      DESIRED_CODE_IDENTIFIER: advanced_booking_rules
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.19.0
      - name: Authenticate Wix CLI
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$WIX_API_KEY"
          npx -y "@wix/cli@${WIX_CLI_VERSION}" login --api-key "$WIX_API_KEY" >/dev/null
      - name: Install pseudo-terminal driver
        run: python3 -m pip install --disable-pip-version-check --quiet pexpect
      - name: Complete immutable metadata using Wix official existing-app interactive flow
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          set -euo pipefail
          git config --global user.name wix-existing-app-finalizer
          git config --global user.email wix-existing-app-finalizer@users.noreply.github.com
          root="$RUNNER_TEMP/wix-existing-app-metadata"
          rm -rf "$root"
          mkdir -p "$root"
          cd "$root"

          cat > /tmp/drive-existing-app.py <<'PY'
          import os, re, sys, time
          import pexpect

          app_id = os.environ['APP_ID']
          namespace = os.environ['DESIRED_NAMESPACE']
          code_identifier = os.environ['DESIRED_CODE_IDENTIFIER']
          version = os.environ['CREATE_NEW_VERSION']

          env = os.environ.copy()
          env.pop('CI', None)
          env['TERM'] = 'xterm-256color'
          cmd = f'npx -y @wix/create-new@{version} app --extend-app-id {app_id}'
          child = pexpect.spawn('/bin/bash', ['-lc', cmd], env=env, encoding='utf-8', timeout=35, dimensions=(40, 160))
          child.logfile = sys.stdout

          # Only metadata prompts receive explicit irreversible values. For local
          # scaffold/template/tooling questions we accept Wix's highlighted default.
          patterns = [
              re.compile(r'(?is)app\s+namespace[^\r\n]*[:?]\s*$'),
              re.compile(r'(?is)namespace[^\r\n]*[:?]\s*$'),
              re.compile(r'(?is)code\s+identifier[^\r\n]*[:?]\s*$'),
              re.compile(r'(?is)(template|starter|project\s+template)[^\r\n]*[:?]\s*$'),
              re.compile(r'(?is)(directory|folder|project\s+name|package\s+name)[^\r\n]*[:?]\s*$'),
              re.compile(r'(?is)(mcp|agent|skills|editor|ide)[^\r\n]*[:?]\s*$'),
              re.compile(r'(?is)(continue|proceed|initialize|git)[^\r\n]*[?]\s*$'),
              pexpect.EOF,
              pexpect.TIMEOUT,
          ]

          namespace_sent = False
          code_sent = False
          interactions = 0
          while interactions < 30:
              interactions += 1
              idx = child.expect(patterns)
              if idx in (0, 1):
                  print(f'\n[AUTOMATION] answering Wix namespace exactly: {namespace}', flush=True)
                  child.sendline(namespace)
                  namespace_sent = True
              elif idx == 2:
                  print(f'\n[AUTOMATION] answering Wix code identifier exactly: {code_identifier}', flush=True)
                  child.sendline(code_identifier)
                  code_sent = True
              elif idx in (3, 4, 5, 6):
                  print('\n[AUTOMATION] accepting Wix highlighted local/default choice', flush=True)
                  child.sendline('')
              elif idx == 7:
                  break
              else:
                  print('\n[ERROR] Unrecognized interactive state / timeout. Refusing blind input.', flush=True)
                  child.close(force=True)
                  sys.exit(44)

          child.close()
          rc = child.exitstatus if child.exitstatus is not None else child.signalstatus
          print(f'\n[AUTOMATION] create-new exit={rc}; namespace_sent={namespace_sent}; code_sent={code_sent}', flush=True)
          if rc not in (0, None):
              sys.exit(int(rc) if isinstance(rc, int) and rc != 0 else 45)
          if not namespace_sent:
              print('[ERROR] Wix never prompted for namespace; refusing to assume it was set.', flush=True)
              sys.exit(46)
          PY

          set +e
          timeout 300 python3 /tmp/drive-existing-app.py 2>&1 | tee /tmp/create-new-existing-app.log
          code=${PIPESTATUS[0]}
          set -e
          if grep -Eqi 'has been registered' /tmp/create-new-existing-app.log; then
            echo '::error::Existing-app flow attempted to register a new app. Refusing to continue.'
            exit 47
          fi
          if grep -Eqi 'namespace.*already.*exist|namespace.*unique|already_exists' /tmp/create-new-existing-app.log; then
            echo "::error::Desired namespace '$DESIRED_NAMESPACE' is already owned by another Wix app; no fallback was attempted."
            exit 42
          fi
          test "$code" = 0

          config="$(find "$root" -type f -name wix.config.json -print -quit)"
          test -n "$config" || { echo '::error::Official existing-app flow produced no wix.config.json.'; exit 48; }
          echo "Generated existing-app config: $config"
          cat "$config"
          test "$(jq -r '.appId // empty' "$config")" = "$APP_ID" || {
            echo '::error::Generated project is not bound to the requested existing app ID.'
            exit 49
          }
          echo "Official Wix existing-app flow completed for exact app $APP_ID with requested namespace $DESIRED_NAMESPACE."
