name: Complete Wix App Metadata Once

on:
  push:
    branches: [factory/real-wix-finalization]
    paths: [.complete-wix-metadata]

permissions:
  contents: read

concurrency:
  group: complete-wix-app-metadata-once
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      APP_ID: 3e9ec3af-001b-4684-a197-a5133677844d
      WIX_CLI_VERSION: 1.1.238
      CREATE_NEW_VERSION: 0.0.108
      DESIRED_NAMESPACE_SUFFIX: advanced-booking-rules
      DESIRED_CODE_IDENTIFIER: advanced_booking_rules
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.19.0
      - name: Authenticate Wix CLI
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$WIX_API_KEY"
          npx -y "@wix/cli@${WIX_CLI_VERSION}" login --api-key "$WIX_API_KEY" >/dev/null
      - name: Install pseudo-terminal driver
        run: python3 -m pip install --disable-pip-version-check --quiet pexpect
      - name: Complete immutable metadata through Wix official existing-app flow
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          set -euo pipefail
          git config --global user.name wix-existing-app-finalizer
          git config --global user.email wix-existing-app-finalizer@users.noreply.github.com
          root="$RUNNER_TEMP/wix-existing-app-metadata"
          rm -rf "$root"
          mkdir -p "$root"
          cd "$root"

          cat > /tmp/drive-existing-app.py <<'PY'
          import os, re, sys
          import pexpect

          app_id = os.environ['APP_ID']
          namespace_suffix = os.environ['DESIRED_NAMESPACE_SUFFIX']
          code_identifier = os.environ['DESIRED_CODE_IDENTIFIER']
          version = os.environ['CREATE_NEW_VERSION']

          env = os.environ.copy()
          env.pop('CI', None)
          env['TERM'] = 'xterm-256color'
          cmd = f'npx -y @wix/create-new@{version} app --extend-app-id {app_id}'
          child = pexpect.spawn('/bin/bash', ['-lc', cmd], env=env, encoding='utf-8', timeout=15, dimensions=(50, 180))
          child.logfile_read = sys.stdout

          patterns = [
              re.compile(r'(?i)(select|choose|pick)[^\r\n]{0,140}(template|starter)'),
              re.compile(r'(?i)(enter|choose|set)[^\r\n]{0,120}namespace'),
              re.compile(r'(?i)namespace[^\r\n]{0,120}(app|project)'),
              re.compile(r'(?i)(enter|choose|set)[^\r\n]{0,120}code\s+identifier'),
              re.compile(r'(?i)code\s+identifier[^\r\n]{0,120}(app|project)'),
              re.compile(r'(?i)(enter|choose)[^\r\n]{0,120}(folder|package|project)\s+name'),
              re.compile(r'(?i)configure[^\r\n]{0,80}wix\s+mcp'),
              re.compile(r'(?i)(continue|proceed|initialize)[^\r\n]{0,100}\?'),
              re.compile(r'(?i)namespace[^\r\n]{0,120}(already exists|already taken|must be unique|unavailable)'),
              pexpect.EOF,
              pexpect.TIMEOUT,
          ]

          namespace_sent = False
          code_sent = False
          template_selected = False
          idle = 0
          interactions = 0

          while interactions < 40:
              idx = child.expect(patterns)
              if idx == 0:
                  interactions += 1
                  idle = 0
                  if not template_selected:
                      print('\n[AUTOMATION] accepting Wix highlighted template', flush=True)
                      child.send('\r')
                      template_selected = True
              elif idx in (1, 2):
                  interactions += 1
                  idle = 0
                  print(f'\n[AUTOMATION] setting namespace suffix: {namespace_suffix}', flush=True)
                  child.sendline(namespace_suffix)
                  namespace_sent = True
              elif idx in (3, 4):
                  interactions += 1
                  idle = 0
                  print(f'\n[AUTOMATION] setting code identifier: {code_identifier}', flush=True)
                  child.sendline(code_identifier)
                  code_sent = True
              elif idx == 5:
                  interactions += 1
                  idle = 0
                  print('\n[AUTOMATION] using deterministic temporary package name', flush=True)
                  child.sendline('advanced-booking-rules-metadata')
              elif idx in (6, 7):
                  interactions += 1
                  idle = 0
                  print('\n[AUTOMATION] accepting Wix highlighted non-metadata default', flush=True)
                  child.send('\r')
              elif idx == 8:
                  print('\n[ERROR] Wix rejected the requested immutable namespace; refusing any fallback.', flush=True)
                  child.close(force=True)
                  sys.exit(42)
              elif idx == 9:
                  break
              else:
                  if not child.isalive():
                      break
                  idle += 1
                  if idle >= 12:
                      print('\n[ERROR] Wix CLI stayed in an unrecognized interactive state for too long.', flush=True)
                      child.close(force=True)
                      sys.exit(44)
                  print(f'\n[AUTOMATION] Wix CLI still running; idle window {idle}/12', flush=True)

          child.close()
          rc = child.exitstatus if child.exitstatus is not None else child.signalstatus
          print(f'\n[AUTOMATION] create-new exit={rc}; template_selected={template_selected}; namespace_sent={namespace_sent}; code_sent={code_sent}', flush=True)
          if rc not in (0, None):
              sys.exit(int(rc) if isinstance(rc, int) and rc != 0 else 45)
          if not template_selected:
              print('[ERROR] Wix never presented the documented template selector.', flush=True)
              sys.exit(46)
          if not namespace_sent:
              print('[NOTICE] Wix did not request a namespace. This can mean immutable metadata already exists; the release workflow is the authoritative verification.', flush=True)
          PY

          set +e
          timeout 360 python3 /tmp/drive-existing-app.py 2>&1 | tee /tmp/create-new-existing-app.log
          code=${PIPESTATUS[0]}
          set -e
          if grep -Eqi 'has been registered' /tmp/create-new-existing-app.log; then
            echo '::error::Existing-app flow attempted to register a new app. Refusing to continue.'
            exit 47
          fi
          test "$code" = 0

          config="$(find "$root" -type f -name wix.config.json -print -quit)"
          test -n "$config" || { echo '::error::Official existing-app flow produced no wix.config.json.'; exit 48; }
          echo "Generated existing-app config: $config"
          cat "$config"
          test "$(jq -r '.appId // empty' "$config")" = "$APP_ID" || {
            echo '::error::Generated project is not bound to the requested existing app ID.'
            exit 49
          }
          echo "Official Wix existing-app flow completed for exact app $APP_ID."
