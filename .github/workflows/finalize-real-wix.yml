name: Finalize Real Wix App

on:
  push:
    branches:
      - factory/real-wix-finalization
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-real-wix-app
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WIX_CLI_VERSION: 1.1.238
      EXPECTED_WIX_APP_ID: 3e9ec3af-001b-4684-a197-a5133677844d
      WIX_SITE_ID: 4d7e75bf-b6ff-4b77-801f-a38e8458b272
    steps:
      - name: Checkout finalization branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.19.0
          check-latest: false

      - name: Validate exact Wix binding
        run: |
          set -euo pipefail
          test -f wix.config.json
          test "$(jq -r '.appId // empty' wix.config.json)" = "$EXPECTED_WIX_APP_ID"

      - name: Authenticate Wix CLI
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$WIX_API_KEY"
          npx -y "@wix/cli@${WIX_CLI_VERSION}" login --api-key "$WIX_API_KEY" >/dev/null

      - name: Assert real Wix runtime exists
        run: |
          set -euo pipefail
          test -s src/extensions.ts
          test -s src/extensions/dashboard/runtime/AdvancedRulesApp.tsx
          test -s src/extensions/dashboard/runtime/LocationsUsageApp.tsx
          test -s src/extensions/dashboard/modals/diff-confirm/diff-confirm.tsx
          test -s src/extensions/backend/data-collections/data-collections.extension.ts
          test -s src/extensions/backend/service-plugins/booking-validation/booking-validation.extension.ts
          test -s src/extensions/backend/service-plugins/booking-validation/booking-validation.ts
          for route in ruleset apply-plan mutation-status recover meter; do
            test -s "src/pages/api/${route}.ts"
          done
          ! grep -R -q 'Edit your page code to change this text' src/extensions/dashboard
          ! grep -R -q 'Wix CLI Modal' src/extensions/dashboard

      - name: Select sandbox and pull Wix environment
        run: |
          set -euo pipefail
          npx -y "@wix/cli@${WIX_CLI_VERSION}" dev-site select "$WIX_SITE_ID"
          printf 'WIX_SITE_ID=%s\n' "$WIX_SITE_ID" > .env.local
          npx -y "@wix/cli@${WIX_CLI_VERSION}" env pull
          grep -q '^WIX_CLIENT_ID=' .env.local || { echo '::error::WIX_CLIENT_ID missing after env pull'; exit 33; }

      - name: Synchronize dependencies and Astro types
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx astro sync

      - name: Deterministic checks
        run: npm run check

      - name: Real Wix build
        run: npx -y "@wix/cli@${WIX_CLI_VERSION}" build

      - name: Persist synchronized lockfile
        if: success()
        run: |
          set -euo pipefail
          git config user.name wix-real-finalizer
          git config user.email wix-real-finalizer@users.noreply.github.com
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "finalization: synchronize generated Wix dependencies"
            git push origin HEAD:factory/real-wix-finalization
          fi
