name: One-shot wire simulated Wix gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-simulator-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare deterministic patcher
        shell: bash
        run: |
          cat > /tmp/patch_sim.py <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/wix-build-loop.yml')
          s = p.read_text()
          if 'name: Simulated Wix acceptance' in s:
              raise SystemExit(0)

          expr = '$' + '{{'
          simulation = f'''\n  simulation:\n    name: Simulated Wix acceptance\n    needs: [prepare, lane]\n    if: {expr} always() && needs.prepare.result == 'success' && needs.lane.result == 'success' }}}}\n    uses: ./.github/workflows/wix-sim.yml\n    with:\n      source_run_id: {expr} github.run_id }}}}\n      cycle_index: {expr} needs.prepare.outputs.cycle_index }}}}\n\n'''
          marker = '\n  director:\n    name: Integration director, planner and deterministic gate\n'
          if marker not in s:
              raise SystemExit('director marker missing')
          s = s.replace(marker, simulation + marker, 1)

          old = "    needs: [prepare, lane]\n    if: " + expr + " always() && needs.prepare.result == 'success' && needs.lane.result == 'success' }}\n"
          new = "    needs: [prepare, lane, simulation]\n    if: " + expr + " always() && needs.prepare.result == 'success' && needs.lane.result == 'success' && needs.simulation.result == 'success' }}\n"
          idx = s.index(marker)
          head, tail = s[:idx], s[idx:]
          if old not in tail:
              raise SystemExit('director needs block missing')
          tail = tail.replace(old, new, 1)
          s = head + tail

          mount_old = '''            done\n          done\n      - name: Set up Node\n'''
          mount_new = '''            done\n          done\n          sim_branch="cycle/wix-build/${GITHUB_RUN_ID}/simulation"\n          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch origin "$sim_branch:refs/remotes/origin/$sim_branch"\n          git worktree add --detach /tmp/wix_simulation "origin/$sim_branch"\n      - name: Set up Node\n'''
          idx = s.index(marker)
          head, tail = s[:idx], s[idx:]
          if mount_old not in tail:
              raise SystemExit('director mount block missing')
          tail = tail.replace(mount_old, mount_new, 1)
          s = head + tail

          prompt_old = 'Independent audit worktrees: /tmp/wix_audit-integration, /tmp/wix_audit-rules, /tmp/wix_audit-dashboard, /tmp/wix_audit-billing. Only VERDICT: ACCEPT lanes may be integrated.'
          prompt_new = 'Independent audit worktrees: /tmp/wix_audit-integration, /tmp/wix_audit-rules, /tmp/wix_audit-dashboard, /tmp/wix_audit-billing. Simulated Wix acceptance worktree: /tmp/wix_simulation. Read its CYCLE_${GITHUB_RUN_ID}.json and .md as binding system-level evidence. Only VERDICT: ACCEPT lanes may be integrated; simulator PASS never overrides a negative audit, while simulator FAIL/INCONCLUSIVE forbids release_candidate and must be routed into repair work.'
          if prompt_old not in s:
              raise SystemExit('director prompt anchor missing')
          s = s.replace(prompt_old, prompt_new, 1)

          enforce_anchor = '''          decision=$(jq -er '.decision | select(. == "continue" or . == "stop" or . == "release_candidate")' "$report_json")\n          test -f docs/NEXT_CYCLE.json\n'''
          enforce_insert = '''          decision=$(jq -er '.decision | select(. == "continue" or . == "stop" or . == "release_candidate")' "$report_json")\n          test -f docs/NEXT_CYCLE.json\n          mkdir -p reports/simulation\n          sim_json_src="/tmp/wix_simulation/reports/simulation/CYCLE_${GITHUB_RUN_ID}.json"\n          sim_md_src="/tmp/wix_simulation/reports/simulation/CYCLE_${GITHUB_RUN_ID}.md"\n          test -f "$sim_json_src" && test -f "$sim_md_src"\n          cp "$sim_json_src" "reports/simulation/CYCLE_${GITHUB_RUN_ID}.json"\n          cp "$sim_md_src" "reports/simulation/CYCLE_${GITHUB_RUN_ID}.md"\n          sim_verdict=$(jq -er '.verdict | select(. == "PASS" or . == "FAIL" or . == "INCONCLUSIVE")' "$sim_json_src")\n          jq -e --arg v "$sim_verdict" '.simulation_verdict == $v and (.simulation_blockers|type=="array")' "$report_json" >/dev/null\n          if [[ "$sim_verdict" == FAIL ]]; then\n            test "$decision" = continue\n            while IFS= read -r role; do\n              [[ "$role" == integration || "$role" == rules || "$role" == dashboard || "$role" == billing ]]\n              jq -e --arg role "$role" '(.repair_lanes // []) | index($role) != null' "$report_json" >/dev/null\n              jq -e --arg role "$role" '.lanes[$role].status == "active"' docs/NEXT_CYCLE.json >/dev/null\n              jq -e --arg role "$role" --arg evidence "reports/simulation/CYCLE_${GITHUB_RUN_ID}.json" '.lanes[$role].source_evidence | index($evidence) != null' docs/NEXT_CYCLE.json >/dev/null\n            done < <(jq -r '.blockers[].lanes[]' "$sim_json_src" | sort -u)\n          elif [[ "$sim_verdict" == INCONCLUSIVE ]]; then\n            test "$decision" = continue\n          fi\n'''
          if enforce_anchor not in s:
              raise SystemExit('enforcement anchor missing')
          s = s.replace(enforce_anchor, enforce_insert, 1)

          release_anchor = '''          if [[ "$decision" == release_candidate ]]; then (( active == 0 && blocked == 0 && complete == 4 )); fi\n'''
          release_new = '''          if [[ "$decision" == release_candidate ]]; then\n            (( active == 0 && blocked == 0 && complete == 4 ))\n            test "$sim_verdict" = PASS\n          fi\n'''
          if release_anchor not in s:
              raise SystemExit('release gate anchor missing')
          s = s.replace(release_anchor, release_new, 1)

          recover_anchor = '''            cp reports/audits/CYCLE_${GITHUB_RUN_ID}_*.md /tmp/recovery/ 2>/dev/null || true\n            git reset --hard "$START_SHA"\n'''
          recover_new = '''            cp reports/audits/CYCLE_${GITHUB_RUN_ID}_*.md /tmp/recovery/ 2>/dev/null || true\n            cp reports/simulation/CYCLE_${GITHUB_RUN_ID}.md /tmp/recovery/ 2>/dev/null || true\n            cp reports/simulation/CYCLE_${GITHUB_RUN_ID}.json /tmp/recovery/ 2>/dev/null || true\n            git reset --hard "$START_SHA"\n'''
          if recover_anchor not in s:
              raise SystemExit('recovery save anchor missing')
          s = s.replace(recover_anchor, recover_new, 1)

          restore_anchor = '''            mkdir -p reports/director reports/audits\n            cp /tmp/recovery/CYCLE_${GITHUB_RUN_ID}.md reports/director/ 2>/dev/null || true\n'''
          restore_new = '''            mkdir -p reports/director reports/audits reports/simulation\n            cp /tmp/recovery/CYCLE_${GITHUB_RUN_ID}.md reports/director/ 2>/dev/null || true\n'''
          if restore_anchor not in s:
              raise SystemExit('recovery restore anchor missing')
          s = s.replace(restore_anchor, restore_new, 1)

          restore2_anchor = '''            cp /tmp/recovery/CYCLE_${GITHUB_RUN_ID}_*.md reports/audits/ 2>/dev/null || true\n            cp /tmp/recovery/NEXT_CYCLE.md docs/NEXT_CYCLE.md 2>/dev/null || true\n'''
          restore2_new = '''            cp /tmp/recovery/CYCLE_${GITHUB_RUN_ID}_*.md reports/audits/ 2>/dev/null || true\n            cp /tmp/recovery/CYCLE_${GITHUB_RUN_ID}.md reports/simulation/ 2>/dev/null || true\n            cp /tmp/recovery/CYCLE_${GITHUB_RUN_ID}.json reports/simulation/ 2>/dev/null || true\n            cp /tmp/recovery/NEXT_CYCLE.md docs/NEXT_CYCLE.md 2>/dev/null || true\n'''
          if restore2_anchor not in s:
              raise SystemExit('recovery evidence anchor missing')
          s = s.replace(restore2_anchor, restore2_new, 1)

          add_anchor = '''            git add -- docs/NEXT_CYCLE.md docs/NEXT_CYCLE.json docs/state.json reports/director reports/audits\n'''
          add_new = '''            git add -- docs/NEXT_CYCLE.md docs/NEXT_CYCLE.json docs/state.json reports/director reports/audits reports/simulation\n'''
          if add_anchor not in s:
              raise SystemExit('recovery git-add anchor missing')
          s = s.replace(add_anchor, add_new, 1)

          p.write_text(s)
          PY

      - name: Patch main and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/patch_sim.py
          grep -q 'name: Simulated Wix acceptance' .github/workflows/wix-build-loop.yml
          grep -q '/tmp/wix_simulation' .github/workflows/wix-build-loop.yml
          grep -q 'test "$sim_verdict" = PASS' .github/workflows/wix-build-loop.yml
          git config user.name "wix-workflow-maintenance"
          git config user.email "wix-workflow-maintenance@users.noreply.github.com"
          git rm .github/workflows/patch-simulator-once.yml
          git add .github/workflows/wix-build-loop.yml
          git commit -m "qa: wire simulated Wix gate before Director"
          git push origin main

      - name: Patch accepted lab workflow without touching product state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main lab/wix-rules
          git switch -C lab/wix-rules origin/lab/wix-rules
          python /tmp/patch_sim.py
          grep -q 'name: Simulated Wix acceptance' .github/workflows/wix-build-loop.yml
          grep -q '/tmp/wix_simulation' .github/workflows/wix-build-loop.yml
          git add .github/workflows/wix-build-loop.yml
          git commit -m "qa: wire simulated Wix gate before Director"
          git push origin lab/wix-rules

# trigger
