name: Probe Wix Namespace Setter

on:
  push:
    branches: [factory/real-wix-finalization]
    paths: [.probe-wix-namespace]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.19.0
      - name: Inspect official Wix namespace implementation
        run: |
          set -euo pipefail
          mkdir /tmp/wixprobe && cd /tmp/wixprobe
          npm pack @wix/create-new@0.0.108 >/dev/null
          mkdir src && tar -xzf wix-create-new-0.0.108.tgz -C src
          f=src/package/build/index.js
          echo '=== dev-center client construction ==='
          sed -n '71870,71935p' "$f"
          echo '=== set namespace HTTP definition ==='
          sed -n '72780,72820p' "$f"
          echo '=== set namespace client method ==='
          sed -n '80660,80720p' "$f"
          echo '=== namespace schemas and validation ==='
          sed -n '80570,80615p' "$f"
          sed -n '81245,81275p' "$f"
          echo '=== namespace UI submission/default ==='
          sed -n '81770,81845p' "$f"
          echo '=== slug/default namespace context ==='
          sed -n '83970,84020p' "$f"
