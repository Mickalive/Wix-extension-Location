name: Probe Wix Namespace Setter

on:
  push:
    branches: [factory/real-wix-finalization]
    paths: [.probe-wix-namespace]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.19.0
      - name: Inspect create-new command and backoffice URL
        run: |
          set -euo pipefail
          mkdir /tmp/wixprobe && cd /tmp/wixprobe
          npm pack @wix/create-new@0.0.108 >/dev/null
          mkdir src && tar -xzf wix-create-new-0.0.108.tgz -C src
          f=src/package/build/index.js

          echo '=== CLI help ==='
          npx -y @wix/create-new@0.0.108 app --help || true

          echo '=== extend-app / namespace / code identifier command option contexts ==='
          for pattern in 'extend-app-id' 'namespace:' 'namespace"' 'code-identifier' 'codeIdentifier' 'package-name'; do
            echo "--- $pattern ---"
            grep -n "$pattern" "$f" | tail -n 30 || true
          done

          echo '=== HTTP client hook implementation ==='
          line="$(grep -n -m1 'function useHttpClient' "$f" | cut -d: -f1 || true)"
          if [[ -n "$line" ]]; then sed -n "$((line-80)),$((line+180))p" "$f"; fi

          echo '=== backoffice type contexts ==='
          grep -n 'type: "backoffice"' "$f" | head -n 30 || true

          echo '=== resolveUrl implementation ==='
          line="$(grep -n -m1 'function resolveUrl' "$f" | cut -d: -f1 || true)"
          if [[ -n "$line" ]]; then sed -n "$((line-20)),$((line+130))p" "$f"; fi

          echo '=== base domain constants / hosts ==='
          grep -nE 'base_domain|wix\.com|manage\.' "$f" | grep -E 'BASE|base|domain|host' | head -n 100 || true
