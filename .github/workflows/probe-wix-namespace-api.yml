name: Probe Wix Namespace Setter

on:
  push:
    branches: [factory/real-wix-finalization]
    paths: [.probe-wix-namespace]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.19.0
      - name: Inspect Wix DevCenter resolver and authenticated client
        run: |
          set -euo pipefail
          mkdir /tmp/wixprobe && cd /tmp/wixprobe
          npm pack @wix/create-new@0.0.108 >/dev/null
          mkdir src && tar -xzf wix-create-new-0.0.108.tgz -C src
          f=src/package/build/index.js

          show_context() {
            local pattern="$1"
            local before="${2:-20}"
            local after="${3:-50}"
            echo "=== $pattern ==="
            local line
            line="$(grep -n -m1 "$pattern" "$f" | cut -d: -f1 || true)"
            if [[ -z "$line" ]]; then
              echo 'NOT FOUND'
              return 0
            fi
            local start=$(( line > before ? line-before : 1 ))
            local end=$(( line+after ))
            sed -n "${start},${end}p" "$f"
          }

          show_context 'resolveWixDevcenterAppsV1AppsServiceUrl' 30 80
          show_context 'class DevCenterClient' 30 90
          show_context 'var DevCenterClient' 30 90
          show_context 'useDevCenterClient' 30 100
          show_context 'new DevCenterClient' 40 80
          show_context 'createHttpClient' 40 100
          show_context 'httpClient:' 40 100
          show_context 'authorization' 30 80
          show_context 'WIX_API_KEY' 30 80
          show_context 'apiKey' 30 100

          echo '=== all dev-center service resolver definitions ==='
          grep -n 'resolveWixDevcenterAppsV1AppsServiceUrl' "$f" | head -n 20 || true
          echo '=== all DevCenterClient construction sites ==='
          grep -nE 'DevCenterClient|useDevCenterClient' "$f" | tail -n 50 || true
