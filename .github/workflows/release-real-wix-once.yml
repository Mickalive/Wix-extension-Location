name: Release Real Wix Once

on:
  push:
    branches:
      - factory/real-wix-finalization
    paths:
      - .release-real-wix

permissions:
  contents: read

concurrency:
  group: release-real-wix-once
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WIX_CLI_VERSION: 1.1.238
      EXPECTED_WIX_APP_ID: 3e9ec3af-001b-4684-a197-a5133677844d
      WIX_SITE_ID: 4d7e75bf-b6ff-4b77-801f-a38e8458b272
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.19.0
          check-latest: false

      - name: Assert real Wix runtime surface
        run: |
          set -euo pipefail
          test "$(jq -r '.appId // empty' wix.config.json)" = "$EXPECTED_WIX_APP_ID"
          test -s src/extensions.ts
          test -s src/extensions/dashboard/runtime/AdvancedRulesApp.tsx
          test -s src/extensions/dashboard/runtime/LocationsUsageApp.tsx
          test -s src/extensions/dashboard/modals/diff-confirm/diff-confirm.tsx
          test -s src/extensions/backend/data-collections/data-collections.extension.ts
          test -s src/extensions/backend/service-plugins/booking-validation/booking-validation.extension.ts
          test -s src/extensions/backend/service-plugins/booking-validation/booking-validation.ts
          for route in ruleset apply-plan mutation-status recover meter; do
            test -s "src/pages/api/${route}.ts"
          done
          ! grep -R -q 'Edit your page code to change this text' src/extensions/dashboard
          ! grep -R -q 'Wix CLI Modal' src/extensions/dashboard

      - name: Authenticate and bind sandbox
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$WIX_API_KEY"
          npx -y "@wix/cli@${WIX_CLI_VERSION}" login --api-key "$WIX_API_KEY" >/dev/null
          npx -y "@wix/cli@${WIX_CLI_VERSION}" dev-site select "$WIX_SITE_ID"
          printf 'WIX_SITE_ID=%s\n' "$WIX_SITE_ID" > .env.local
          npx -y "@wix/cli@${WIX_CLI_VERSION}" env pull
          grep -q '^WIX_CLIENT_ID=' .env.local

      - name: Install locked dependencies and sync Astro
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx astro sync

      - name: Re-run deterministic product checks
        run: npm run check

      - name: Re-run real Wix build
        run: npx -y "@wix/cli@${WIX_CLI_VERSION}" build

      - name: Release real Wix app version
        env:
          CI: '1'
        run: |
          set -euo pipefail
          npx -y "@wix/cli@${WIX_CLI_VERSION}" release \
            --version-type minor \
            --comment "Advanced Booking Rules real Wix runtime finalization ${GITHUB_SHA}" \
            2>&1 | tee /tmp/wix-release.log
          test -s /tmp/wix-release.log
          if grep -Eqi 'error|failed|failure' /tmp/wix-release.log; then
            echo '::error::Wix release output contains an error marker.'
            cat /tmp/wix-release.log
            exit 40
          fi
          grep -Ei 'released|release|version|dashboard|published|preview|complete' /tmp/wix-release.log || {
            echo '::error::Wix release returned success without recognizable release evidence.'
            cat /tmp/wix-release.log
            exit 41
          }

      - name: Rebind latest released app to sandbox
        run: |
          set -euo pipefail
          npx -y "@wix/cli@${WIX_CLI_VERSION}" dev-site select "$WIX_SITE_ID"
          printf 'WIX_SITE_ID=%s\n' "$WIX_SITE_ID" > .env.local
          npx -y "@wix/cli@${WIX_CLI_VERSION}" env pull
          grep -q '^WIX_CLIENT_ID=' .env.local
          echo "Latest released app rebound to sandbox $WIX_SITE_ID"

      - name: Confirm Wix Bookings still responds on sandbox
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/bookings.json -w '%{http_code}' \
            -H "Authorization: $WIX_API_KEY" \
            -H "wix-site-id: $WIX_SITE_ID" \
            -H 'Content-Type: application/json' \
            -X POST \
            -d '{"query":{"paging":{"limit":1}}}' \
            'https://www.wixapis.com/bookings/v2/bookings/query')"
          echo "Bookings probe HTTP $code"
          test "$code" = 200
