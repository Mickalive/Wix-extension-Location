name: Set Wix Namespace Once

on:
  push:
    branches: [factory/real-wix-finalization]
    paths: [.set-wix-namespace]

permissions:
  contents: read

concurrency:
  group: set-wix-namespace-once
  cancel-in-progress: false

jobs:
  set-namespace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_ID: 3e9ec3af-001b-4684-a197-a5133677844d
      DESIRED_NAMESPACE: advanced-booking-rules
      WIX_CLI_VERSION: 1.1.238
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.19.0
      - name: Authenticate Wix CLI
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$WIX_API_KEY"
          npx -y "@wix/cli@${WIX_CLI_VERSION}" login --api-key "$WIX_API_KEY" >/dev/null
      - name: Read and set immutable app namespace through Wix official endpoint
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          set -euo pipefail
          endpoint="https://www.wixapis.com/v1/apps/${APP_ID}"
          status="$(curl -sS -o /tmp/app-before.json -w '%{http_code}' -H "Authorization: $WIX_API_KEY" "$endpoint")"
          echo "GetApp HTTP $status"
          if [[ "$status" == 200 ]]; then
            jq '{id:(.app.id // .id), namespace:(.app.namespace // .namespace // null), codeIdentifier:(.app.codeIdentifier // .codeIdentifier // null)}' /tmp/app-before.json
            current="$(jq -r '.app.namespace // .namespace // empty' /tmp/app-before.json)"
            if [[ -n "$current" ]]; then
              echo "App namespace already set to: $current"
              exit 0
            fi
          else
            echo 'GetApp body:'
            jq '{message,details}' /tmp/app-before.json 2>/dev/null || cat /tmp/app-before.json
          fi

          body="$(jq -nc --arg ns "$DESIRED_NAMESPACE" '{appName:$ns}')"
          patch_status="$(curl -sS -X PATCH -o /tmp/set-namespace.json -w '%{http_code}' \
            -H "Authorization: $WIX_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "$body" \
            "${endpoint}/set-namespace")"
          echo "SetNamespace HTTP $patch_status"
          jq '{namespace,message,details}' /tmp/set-namespace.json 2>/dev/null || cat /tmp/set-namespace.json
          if [[ "$patch_status" == 409 ]]; then
            echo "::error::Namespace '$DESIRED_NAMESPACE' is already owned by another Wix app; refusing any silent fallback because namespace is immutable."
            exit 42
          fi
          [[ "$patch_status" =~ ^2[0-9][0-9]$ ]] || exit 43
          returned="$(jq -r '.namespace // empty' /tmp/set-namespace.json)"
          test "$returned" = "$DESIRED_NAMESPACE"
          echo "Wix app namespace permanently set to $returned"
