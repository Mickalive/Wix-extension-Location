name: One-shot sync public-safe autonomous infra

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-public-infra.yml"

permissions:
  contents: write

env:
  LAB_BRANCH: lab/wix-rules

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Sync only autonomous infrastructure into accepted lab state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$LAB_BRANCH"
          main_sha=$(git rev-parse origin/main)
          git switch -C "$LAB_BRANCH" "origin/$LAB_BRANCH"
          git checkout "$main_sha" -- \
            .github/actions/setup-opencode/action.yml \
            .github/scripts/run-opencode-with-retry.sh \
            .github/scripts/recover-transient-opencode.sh \
            .github/workflows/ci.yml \
            .github/workflows/wix-build-loop.yml \
            .github/workflows/wix-launch.yml \
            .github/workflows/wix-recon.yml \
            .opencode/agents/billing-builder.md \
            .opencode/agents/dashboard-builder.md \
            .opencode/agents/lane-auditor.md \
            .opencode/agents/rules-engine-builder.md \
            .opencode/agents/wix-bookings-researcher.md \
            .opencode/agents/wix-build-director.md \
            .opencode/agents/wix-commerce-researcher.md \
            .opencode/agents/wix-integration-builder.md \
            .opencode/agents/wix-platform-researcher.md \
            .opencode/agents/wix-recon-director.md \
            AGENTS.md \
            directives/DIRECTOR.md \
            docs/agent-workflow.md
          test "$(jq -r '.phase' docs/state.json)" = build
          test -f reports/audits/RECON.md
          printf '%s  MAIN_PROMPT.md\n' '9cdd0500552998adedbae7e2cc7605ca443187393b6299f0bf4ffdcba18c9101' | sha256sum --check --strict
          if git diff --cached --quiet && git diff --quiet; then
            echo "No infrastructure divergence remains."
            exit 0
          fi
          git config user.name "wix-infra-sync"
          git config user.email "wix-infra-sync@users.noreply.github.com"
          git add .github .opencode AGENTS.md directives/DIRECTOR.md docs/agent-workflow.md
          git commit -m "sync public-safe autonomous infrastructure"
          git push origin "$LAB_BRANCH"

# one-shot trigger
