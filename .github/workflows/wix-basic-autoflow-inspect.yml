name: Wix Basic App AutoFlow Inspect

on:
  push:
    branches: [main]
    paths: [".github/workflows/wix-basic-autoflow-inspect.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0
      - name: Locate direct DevCenter client entrypoint
        shell: bash
        run: |
          set -euo pipefail
          d=$(mktemp -d); cd "$d"
          tgz=$(npm pack @wix/create-new@0.0.105 --silent); tar -xzf "$tgz"
          f=package/build/index.js
          echo '=== DEV CENTER CLASS ==='
          grep -n 'var DevCenterClient = class\|class DevCenterClient' "$f" | head -10 || true
          echo '=== CREATE HTTP CLIENT DEFINITIONS ==='
          grep -n 'function createHttpClient\|var createHttpClient\|createHttpClient =' "$f" | head -30 || true
          echo '=== APP COMMAND INVOCATIONS ==='
          grep -nE 'render\(|runApp|AppCommand|process\.argv|command\.parse|program\.parse|parseAsync' "$f" | tail -100 || true
          echo '=== FILE TAIL ==='
          tail -220 "$f"
