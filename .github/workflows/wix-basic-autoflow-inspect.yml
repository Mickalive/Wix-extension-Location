name: Wix Basic App AutoFlow Inspect

on:
  push:
    branches: [main]
    paths: [".github/workflows/wix-basic-autoflow-inspect.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0
      - name: Inspect identity generation and QueryApp fields
        shell: bash
        run: |
          set -euo pipefail
          d=$(mktemp -d); cd "$d"
          tgz=$(npm pack @wix/create-new@0.0.105 --silent); tar -xzf "$tgz"
          f=package/build/index.js
          echo '=== V1 APP SERIALIZER ==='
          grep -n -B8 -A45 'var _v1App =\|_v1App = {' "$f" | head -120 || true
          echo '=== APP CREATION FLOW ==='
          grep -n 'function useAppCreation\|var useAppCreation\|useAppCreation =' "$f" | head -10 || true
          n=$(grep -n 'function useAppCreation\|var useAppCreation\|useAppCreation =' "$f" | head -1 | cut -d: -f1)
          if [[ -n "$n" ]]; then start=$((n-40)); end=$((n+220)); sed -n "${start},${end}p" "$f"; fi
          echo '=== NAMESPACE / CODE IDENTIFIER SUGGESTIONS ==='
          grep -n -B12 -A30 -E 'suggest.*namespace|suggest.*code|namespace.*suggest|codeIdentifier.*suggest|generate.*namespace|generate.*code|setNamespace\(|setCodeIdentifier\(' "$f" | head -500 || true
          echo '=== CONFIG GENERATION ==='
          grep -n -B20 -A60 -E 'wix\.config\.json|projectId|environmentId|projectType' "$f" | grep -E 'wix\.config|projectId|environmentId|projectType|appId|writeFile' | head -350 || true
