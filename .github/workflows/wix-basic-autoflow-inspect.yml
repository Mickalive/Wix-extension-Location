name: Wix Basic App AutoFlow Inspect

on:
  push:
    branches: [main]
    paths: [".github/workflows/wix-basic-autoflow-inspect.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0
      - name: Inspect AppsService ambassador package
        shell: bash
        run: |
          set -euo pipefail
          d=$(mktemp -d); cd "$d"
          echo '=== NPM VERSION ==='
          npm view @wix/ambassador-devcenter-apps-v1-app version
          tgz=$(npm pack @wix/ambassador-devcenter-apps-v1-app --silent)
          tar -xzf "$tgz"
          pkg="$d/package"
          echo '=== PACKAGE ==='
          cat "$pkg/package.json"
          echo '=== FILES ==='
          find "$pkg" -maxdepth 5 -type f | sort | head -260
          echo '=== QUERY CONTRACT HITS ==='
          grep -RniE 'QueryApp|queryApp|filterable|filter.*field|createdDate|updatedDate|codeIdentifier|namespace|supported.*filter' "$pkg" --exclude='*.map' | head -1200 || true
          echo '=== TYPES / PROTOS / DESCRIPTORS ==='
          while IFS= read -r f; do
            if grep -qiE 'QueryApp|createdDate|codeIdentifier|namespace' "$f"; then
              echo "--- $f ---"
              grep -ni -B15 -A60 -E 'QueryApp|createdDate|updatedDate|codeIdentifier|namespace|filter' "$f" | head -360 || true
            fi
          done < <(find "$pkg" -type f \( -name '*.d.ts' -o -name '*.proto' -o -name '*.json' \) | sort)
