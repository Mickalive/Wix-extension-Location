name: Wix Basic App AutoFlow Inspect

on:
  push:
    branches: [main]
    paths: [".github/workflows/wix-basic-autoflow-inspect.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0
      - name: Inspect QueryApp payload and response
        shell: bash
        run: |
          set -euo pipefail
          d=$(mktemp -d); cd "$d"
          tgz=$(npm pack @wix/create-new@0.0.105 --silent); tar -xzf "$tgz"
          f=package/build/index.js
          echo '=== QUERY APP FUNCTION ==='
          sed -n '72620,72690p' "$f"
          echo '=== QUERY APP SCHEMAS / CALLERS ==='
          grep -n -B15 -A35 'queryAppSchema\|queryApp({' "$f" | head -260 || true
          echo '=== APP DATA SCHEMA ==='
          grep -n -B15 -A50 'var appSchema\|const appSchema\|appName:' "$f" | head -260 || true
