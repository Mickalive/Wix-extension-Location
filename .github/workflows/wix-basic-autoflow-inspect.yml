name: Wix Basic App AutoFlow Inspect

on:
  push:
    branches: [main]
    paths: [".github/workflows/wix-basic-autoflow-inspect.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0
      - name: Print embedded AppsService generated types
        shell: bash
        run: |
          set -euo pipefail
          d=$(mktemp -d); cd "$d"
          tgz=$(npm pack @wix/create-new@0.0.105 --silent)
          tar -xzf "$tgz"
          PKG="$d/package" node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.env.PKG;
          const maps=[];
          const walk=d=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name); if(e.isDirectory()) walk(p); else if(e.isFile()&&e.name.endsWith('.map')) maps.push(p)}};
          walk(root);
          let found=0;
          for(const mp of maps){
            let m; try{m=JSON.parse(fs.readFileSync(mp,'utf8'))}catch{continue}
            for(let i=0;i<(m.sources||[]).length;i++){
              const src=m.sources[i]||''; const txt=(m.sourcesContent||[])[i]||'';
              if(/node_modules\/@wix\/ambassador-devcenter-apps-v1-app\/(types\.impl|http\.impl)\.ts$/.test(src)){
                found++;
                console.log('\n===== '+src+' =====');
                const lines=txt.split('\n');
                for(let j=0;j<Math.min(lines.length,900);j++) console.log(String(j+1).padStart(5)+': '+lines[j]);
              }
            }
          }
          console.log('FOUND='+found);
          if(!found) process.exit(2);
          NODE
