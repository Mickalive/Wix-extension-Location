name: Wix Basic App AutoFlow Inspect

on:
  push:
    branches: [main]
    paths: [".github/workflows/wix-basic-autoflow-inspect.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0
      - name: Inspect existing-app discovery and extend flow
        shell: bash
        run: |
          set -euo pipefail
          d=$(mktemp -d); cd "$d"
          tgz=$(npm pack @wix/create-new@0.0.105 --silent); tar -xzf "$tgz"
          f=package/build/index.js
          echo '=== GET DEVELOPER APPS HITS ==='
          grep -nE 'getDeveloperApps|queryApps|listApps|SearchApps|AppsService\.' "$f" | head -120 || true
          echo '=== GET DEVELOPER APPS CONTEXTS ==='
          while IFS=: read -r n rest; do
            start=$((n-24)); (( start < 1 )) && start=1
            end=$((n+45))
            echo "--- around line $n ---"
            sed -n "${start},${end}p" "$f"
          done < <(grep -n 'getDeveloperApps' "$f" | head -8)
          echo '=== APP SERVICE ROUTES ==='
          grep -nE 'protoPath: "/v1/apps|protoPath: "/v2/apps|query-app|list-app' "$f" | head -80 || true
          echo '=== EXTEND APP ID OPTION CONTEXT ==='
          grep -n -B12 -A24 'extend-app-id' "$f" | head -120 || true
