name: Wix Basic App AutoFlow Inspect

on:
  push:
    branches: [main]
    paths: [".github/workflows/wix-basic-autoflow-inspect.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0
      - name: Inspect direct HTTP client construction
        shell: bash
        run: |
          set -euo pipefail
          d=$(mktemp -d); cd "$d"
          tgz=$(npm pack @wix/create-new@0.0.105 --silent); tar -xzf "$tgz"
          f=package/build/index.js
          echo '=== CREATE HTTP CLIENT ==='
          sed -n '49045,49155p' "$f"
          echo '=== USE HTTP CLIENT ==='
          grep -n 'function useHttpClient\|var useHttpClient' "$f" | head -10
          n=$(grep -n 'function useHttpClient\|var useHttpClient' "$f" | head -1 | cut -d: -f1)
          if [[ -n "$n" ]]; then start=$((n-20)); end=$((n+70)); sed -n "${start},${end}p" "$f"; fi
          echo '=== AUTH STRATEGY / CREATE CLIENT CALLERS ==='
          grep -nE 'createHttpClient\(\{|createApiKeyAuthState|isLoggedIn\(' "$f" | tail -100
