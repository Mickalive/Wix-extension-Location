name: Wix Basic App AutoFlow Inspect

on:
  push:
    branches: [main]
    paths: [".github/workflows/wix-basic-autoflow-inspect.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0
      - name: Inspect AppsService filter contracts
        shell: bash
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          npm install --prefix "$d" --no-audit --no-fund --ignore-scripts @wix/create-new@0.0.105 >/dev/null
          pkg="$d/node_modules/@wix/ambassador-devcenter-apps-v1-app"
          test -d "$pkg"
          echo '=== PACKAGE VERSION ==='
          node -e 'const p=require(process.argv[1]); console.log(p.version)' "$pkg/package.json"
          echo '=== FILES ==='
          find "$pkg" -maxdepth 4 -type f | sort | head -220
          echo '=== QUERY CONTRACT HITS ==='
          grep -RniE 'QueryApp|queryApp|filterable|filter.*field|createdDate|updatedDate|codeIdentifier|namespace' "$pkg" --exclude='*.map' | head -800 || true
          echo '=== TYPES / DESCRIPTORS ==='
          for f in $(find "$pkg" -type f \( -name '*.d.ts' -o -name '*.proto' -o -name '*.json' \) | sort); do
            if grep -qiE 'QueryApp|createdDate|codeIdentifier|namespace' "$f"; then
              echo "--- $f ---"
              grep -ni -B12 -A45 -E 'QueryApp|createdDate|updatedDate|codeIdentifier|namespace' "$f" | head -260 || true
            fi
          done
