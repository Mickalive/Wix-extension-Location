name: Wix One-Shot App Binding

on:
  push:
    branches: [main]
    paths: [".github/workflows/wix-bootstrap-binding.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: wix-one-shot-app-binding-exact
  cancel-in-progress: true

jobs:
  bind:
    name: Bind exact Wix app and verify real build
    if: ${{ github.repository == 'Mickalive/Wix-extension-Location' && !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      TARGET_WIX_APP_ID: 3e9ec3af-001b-4684-a197-a5133677844d
    steps:
      - name: Cancel obsolete Wix bootstrap experiments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for wf in wix-bootstrap-binding.yml wix-bootstrap-wizard-v4.yml wix-bootstrap-wizard-v5.yml; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --limit 20 --json databaseId,status 2>/dev/null \
              | jq -r --arg current "$GITHUB_RUN_ID" '.[] | select((.status=="in_progress" or .status=="queued" or .status=="pending") and (.databaseId|tostring)!=$current) | .databaseId' \
              | while read -r id; do
                  [[ -z "$id" ]] && continue
                  gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" >/dev/null 2>&1 || true
                done
          done

      - name: Checkout accepted product state
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          ref: lab/wix-rules
          persist-credentials: false

      - name: Pin accepted head
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ -f wix.config.json ]]; then
            jq -e --arg id "$TARGET_WIX_APP_ID" '.appId == $id' wix.config.json >/dev/null || {
              echo "::error::Existing wix.config.json is bound to a different app ID."
              exit 1
            }
            echo "already_bound=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_bound=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0

      - name: Authenticate Wix CLI from protected repository secret
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIX_API_KEY" || { echo "::error::WIX_API_KEY missing"; exit 1; }
          npx -y @wix/cli@1.1.238 logout >/dev/null 2>&1 || true
          npx -y @wix/cli@1.1.238 login --api-key "$WIX_API_KEY" >/tmp/wix-login.log 2>&1 || {
            sed -E 's/[A-Za-z0-9_=-]{24,}/[REDACTED]/g' /tmp/wix-login.log >&2
            rm -f /tmp/wix-login.log
            exit 1
          }
          rm -f /tmp/wix-login.log

      - name: Scaffold the exact existing Wix app
        id: create
        if: ${{ steps.base.outputs.already_bound != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_WIX_APP_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          root=$(mktemp -d)
          pkg="$root/pkg"
          work="$root/work"
          mkdir -p "$pkg" "$work"

          cd "$pkg"
          tgz=$(npm pack @wix/create-new@0.0.105 --silent)
          tar -xzf "$tgz"
          blank="$pkg/package/templates/app/blank"
          test -d "$blank" || { echo "::error::Pinned Wix package has no blank local template."; exit 1; }

          git config --global user.name wix-binding-bootstrap
          git config --global user.email wix-binding-bootstrap@users.noreply.github.com

          cd "$work"
          set +e
          timeout 420s npm exec --yes --package=@wix/create-new@0.0.105 -- create-new app \
            --extend-app-id "$TARGET_WIX_APP_ID" \
            --app-name "Advanced Booking Rules" \
            --template-path "$blank" \
            --skip-git >/tmp/wix-extend.log 2>&1
          create_rc=$?
          set -e

          config=$(find "$work" -mindepth 2 -maxdepth 4 -type f -name wix.config.json -print -quit)
          if [[ -z "$config" ]]; then
            sed -E 's/[A-Za-z0-9_=-]{40,}/[REDACTED]/g' /tmp/wix-extend.log | tail -180 >&2
            echo "::error::Existing-app scaffold did not produce wix.config.json"
            rm -f /tmp/wix-extend.log
            exit 1
          fi

          jq -e --arg id "$TARGET_WIX_APP_ID" 'type=="object" and .appId==$id and (.projectId|type=="string" and length>0) and (.projectType|type=="string" and length>0)' "$config" >/dev/null || {
            echo "::error::Generated Wix binding is incomplete or points to another app."
            exit 1
          }

          if (( create_rc != 0 )); then
            if grep -q 'FailedToRunExternalCommand' /tmp/wix-extend.log \
              && grep -Eq 'skills add|agent-skills' /tmp/wix-extend.log; then
              echo "::warning::Wix scaffold hit only the auxiliary agent-skills installer after the real binding was generated; continuing to real wix build."
            else
              sed -E 's/[A-Za-z0-9_=-]{40,}/[REDACTED]/g' /tmp/wix-extend.log | tail -180 >&2
              echo "::error::Wix scaffold failed for a reason other than the known auxiliary skills installer."
              exit 1
            fi
          fi
          rm -f /tmp/wix-extend.log

          if jq -e 'paths(scalars) as $p | ($p|map(tostring)|join(".")) | test("secret|token|password|api.?key";"i")' "$config" >/dev/null; then
            echo "::error::Generated wix.config.json contains a secret-like field"
            exit 1
          fi
          cp "$config" "$GITHUB_WORKSPACE/wix.config.json"
          echo "project_dir=$(dirname "$config")" >> "$GITHUB_OUTPUT"

      - name: Verify exact binding with real Wix build
        id: realbuild
        env:
          PROJECT_DIR: ${{ steps.create.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.base.outputs.already_bound }}" == "true" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          fi
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          timeout 240s npx -y @wix/cli@1.1.238 build >/tmp/wix-build.log 2>&1 || {
            sed -E 's/[A-Za-z0-9_=-]{40,}/[REDACTED]/g' /tmp/wix-build.log | tail -160 >&2
            rm -f /tmp/wix-build.log
            exit 1
          }
          rm -f /tmp/wix-build.log
          echo "REAL_WIX_BUILD=SUCCESS"

      - name: Record non-secret binding evidence
        if: ${{ steps.base.outputs.already_bound != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/wix-live
          keys=$(jq -r 'keys|sort|join(", ")' wix.config.json)
          cat > reports/wix-live/BOOTSTRAP_BINDING.md <<EOF
          # Authenticated Wix app binding

          GitHub Actions authenticated with the protected Wix API key and bound the product to the explicitly selected existing Wix app **Advanced Booking Rules** (App ID: $TARGET_WIX_APP_ID). No app was created by this run.

          Wix generated a real wix.config.json for that exact app and a real \`wix build\` completed successfully before the binding was persisted. The create-new scaffold may emit a known auxiliary Wix agent-skills installation failure in CI; that failure is accepted only after validating the real appId/projectId/projectType and is not treated as product evidence. The subsequent real \`wix build\` remains mandatory.

          Persisted wix.config.json fields: $keys

          No API key, account auth store, token, password, patched Wix package, or other credential was persisted.
          EOF

      - name: Persist Wix binding to accepted product branch
        if: ${{ steps.base.outputs.already_bound != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name wix-binding-bootstrap
          git config user.email wix-binding-bootstrap@users.noreply.github.com
          git add -f wix.config.json reports/wix-live/BOOTSTRAP_BINDING.md
          git commit -m "wix: persist verified existing-app binding"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          remote=$(git -c "http.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/lab/wix-rules | awk '{print $1}')
          test "$remote" = "$BASE_SHA" || { echo "::error::lab/wix-rules moved during Wix bootstrap"; exit 1; }
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/lab/wix-rules

      - name: Existing verified binding
        if: ${{ steps.base.outputs.already_bound == 'true' }}
        run: echo "Exact Wix binding already exists and real wix build passed."
