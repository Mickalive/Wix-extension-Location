name: Wix One-Shot App Binding

on:
  push:
    branches: [main]
    paths: [".github/workflows/wix-bootstrap-binding.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wix-one-shot-app-binding
  cancel-in-progress: false

jobs:
  bind:
    name: Register real Wix app and persist binding
    if: ${{ github.repository == 'Mickalive/Wix-extension-Location' && !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout accepted product state
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          ref: lab/wix-rules
          persist-credentials: false
      - name: Pin accepted head
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ -f wix.config.json ]]; then echo "already_bound=true" >> "$GITHUB_OUTPUT"; else echo "already_bound=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        if: ${{ steps.base.outputs.already_bound != 'true' }}
        with:
          node-version: 22.13.0
      - name: Authenticate Wix CLI with repository secret
        if: ${{ steps.base.outputs.already_bound != 'true' }}
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIX_API_KEY"
          npx -y @wix/cli@1.1.237 login --api-key "$WIX_API_KEY" >/tmp/wix-login.log 2>&1 || { sed -E 's/[A-Za-z0-9_=-]{24,}/[REDACTED]/g' /tmp/wix-login.log >&2; rm -f /tmp/wix-login.log; exit 1; }
          rm -f /tmp/wix-login.log
      - name: Register a real Wix app non-interactively
        if: ${{ steps.base.outputs.already_bound != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          npm create @wix/new@latest app -- --app-name "Advanced Booking Rules" --template 5fcf03b8-46ba-499b-8dbb-40ecf811aceb >/tmp/wix-create.log 2>&1 || { sed -E 's/[A-Za-z0-9_=-]{24,}/[REDACTED]/g' /tmp/wix-create.log >&2; rm -f /tmp/wix-create.log; exit 1; }
          rm -f /tmp/wix-create.log
          config=$(find "$work" -mindepth 2 -maxdepth 4 -type f -name wix.config.json -print -quit)
          test -n "$config"
          jq -e 'type=="object" and (.appId|type=="string" and length>0) and (.projectId|type=="string" and length>0) and (.projectType|type=="string" and length>0)' "$config" >/dev/null
          if jq -e 'paths(scalars) as $p | ($p|map(tostring)|join(".")) | test("secret|token|password|api.?key";"i")' "$config" >/dev/null; then exit 1; fi
          cp "$config" "$GITHUB_WORKSPACE/wix.config.json"
      - name: Verify generated project binding with Wix build
        if: ${{ steps.base.outputs.already_bound != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          npx -y @wix/cli@1.1.237 build >/tmp/wix-build.log 2>&1 || { sed -E 's/[A-Za-z0-9_=-]{24,}/[REDACTED]/g' /tmp/wix-build.log >&2; rm -f /tmp/wix-build.log; exit 1; }
          rm -f /tmp/wix-build.log
      - name: Record non-secret bootstrap evidence
        if: ${{ steps.base.outputs.already_bound != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/wix-live
          keys=$(jq -r 'keys|sort|join(", ")' wix.config.json)
          cat > reports/wix-live/BOOTSTRAP_BINDING.md <<EOF
          # Wix authenticated app binding

          Wix CLI authentication succeeded using the GitHub Actions secret. A new Custom App named **Advanced Booking Rules** was registered non-interactively and the generated project binding passed a real Wix build.

          Persisted wix.config.json fields: $keys

          No API key, auth file or credential was persisted.
          EOF
      - name: Persist only binding metadata to accepted branch
        if: ${{ steps.base.outputs.already_bound != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name wix-binding-bootstrap
          git config user.email wix-binding-bootstrap@users.noreply.github.com
          git add -f wix.config.json reports/wix-live/BOOTSTRAP_BINDING.md
          git commit -m "wix: persist authenticated app binding"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          remote=$(git -c "http.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/lab/wix-rules | awk '{print $1}')
          test "$remote" = "$BASE_SHA"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/lab/wix-rules
      - name: Already bound
        if: ${{ steps.base.outputs.already_bound == 'true' }}
        run: echo "A real wix.config.json already exists; no new Wix app was created."
