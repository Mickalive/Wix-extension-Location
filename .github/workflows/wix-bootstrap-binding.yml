name: Wix One-Shot App Binding

on:
  push:
    branches: [main]
    paths: [".github/workflows/wix-bootstrap-binding.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: wix-one-shot-app-binding-final
  cancel-in-progress: true

jobs:
  bind:
    name: Recover existing Wix app and persist real binding
    if: ${{ github.repository == 'Mickalive/Wix-extension-Location' && !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Cancel obsolete Wix bootstrap experiments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for wf in wix-bootstrap-binding.yml wix-bootstrap-wizard-v4.yml wix-bootstrap-wizard-v5.yml; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --limit 20 --json databaseId,status 2>/dev/null \
              | jq -r --arg current "$GITHUB_RUN_ID" '.[] | select((.status=="in_progress" or .status=="queued" or .status=="pending") and (.databaseId|tostring)!=$current) | .databaseId' \
              | while read -r id; do
                  [[ -z "$id" ]] && continue
                  gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" >/dev/null 2>&1 || true
                done
          done

      - name: Checkout accepted product state
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          ref: lab/wix-rules
          persist-credentials: false

      - name: Pin accepted head
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          [[ -f wix.config.json ]] && echo "already_bound=true" >> "$GITHUB_OUTPUT" || echo "already_bound=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        if: ${{ steps.base.outputs.already_bound != 'true' }}
        with:
          node-version: 22.13.0

      - name: Authenticate Wix CLI from protected repository secret
        if: ${{ steps.base.outputs.already_bound != 'true' }}
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIX_API_KEY" || { echo "::error::WIX_API_KEY missing"; exit 1; }
          npx -y @wix/cli@1.1.238 logout >/dev/null 2>&1 || true
          npx -y @wix/cli@1.1.238 login --api-key "$WIX_API_KEY" >/tmp/wix-login.log 2>&1 || {
            sed -E 's/[A-Za-z0-9_=-]{24,}/[REDACTED]/g' /tmp/wix-login.log >&2
            rm -f /tmp/wix-login.log
            exit 1
          }
          rm -f /tmp/wix-login.log

      - name: Discover existing app through Wix's own Dev Center client
        id: app
        if: ${{ steps.base.outputs.already_bound != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          root=$(mktemp -d)
          npm install --prefix "$root" --no-audit --no-fund --ignore-scripts @wix/create-new@0.0.105 >/dev/null
          entry="$root/node_modules/@wix/create-new/build/index.js"
          test -f "$entry" || { echo "::error::Pinned Wix create-new entrypoint not found."; exit 1; }

          ENTRY="$entry" node <<'NODE'
          const fs = require('fs');
          const p = process.env.ENTRY;
          let s = fs.readFileSync(p, 'utf8');
          const needle = 'try {\n  await program2.parseAsync();';
          const hits = s.split(needle).length - 1;
          if (hits !== 1) {
            console.error(`Expected one Wix command entrypoint, found ${hits}`);
            process.exit(2);
          }
          const direct = `if (process.env.WIX_DUMP_APPS === "1") {
            const authState = await apiKeyAuthStrategy.isLoggedIn();
            if (!authState) {
              console.error("WIX_DIRECT_AUTH_MISSING");
              process.exit(2);
            }
            const directHttpClient = createHttpClient({
              type: "backoffice",
              getAppToken: () => authState.getAccessToken(),
              createHeaders: () => authState.getRequestHeaders()
            });
            const directDevCenter = new DevCenterClient(directHttpClient);
            const directApps = await directDevCenter.getDeveloperApps();
            console.log("WIX_DEVELOPER_APPS_JSON=" + JSON.stringify(directApps));
            process.exit(0);
          }
          `;
          s = s.replace(needle, direct + needle);
          fs.writeFileSync(p, s);
          NODE

          set +e
          (
            cd "$root"
            WIX_DUMP_APPS=1 timeout 90s npm exec -- create-new
          ) >/tmp/wix-app-discovery.out 2>&1
          rc=$?
          set -e
          marker=$(grep -a 'WIX_DEVELOPER_APPS_JSON=' /tmp/wix-app-discovery.out | tail -1 | tr -d '\r' || true)
          if [[ -z "$marker" ]]; then
            echo "::error::Direct Wix Dev Center client query failed (exit $rc)."
            sed -E 's/[A-Za-z0-9_=-]{24,}/[REDACTED]/g' /tmp/wix-app-discovery.out | tail -120 >&2
            rm -rf "$root" /tmp/wix-app-discovery.out
            exit 1
          fi
          json=${marker#*WIX_DEVELOPER_APPS_JSON=}
          APP_ID=$(printf '%s' "$json" | jq -r '[.[] | select(.appData.appName == "Advanced Booking Rules")][0].id // empty')
          MATCHES=$(printf '%s' "$json" | jq '[.[] | select(.appData.appName == "Advanced Booking Rules")] | length')
          rm -rf "$root" /tmp/wix-app-discovery.out

          test -n "$APP_ID" || { echo "::error::Wix did not return the already-registered Advanced Booking Rules app."; exit 1; }
          [[ "$APP_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "::error::Wix returned a malformed app id."; exit 1; }
          if (( MATCHES > 1 )); then
            echo "::warning::Multiple apps share this name; Wix returns them updatedDate DESC, so the most recent match is selected."
          fi
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "Direct Wix Dev Center client resolved the existing Advanced Booking Rules app; no new app will be registered."

      - name: Scaffold that exact existing app without creating a duplicate
        id: create
        if: ${{ steps.base.outputs.already_bound != 'true' }}
        env:
          APP_ID: ${{ steps.app.outputs.app_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APP_ID"
          root=$(mktemp -d)
          pkg="$root/pkg"
          work="$root/work"
          mkdir -p "$pkg" "$work"
          cd "$pkg"
          tgz=$(npm pack @wix/create-new@0.0.105 --silent)
          tar -xzf "$tgz"
          blank="$pkg/package/templates/app/blank"
          test -d "$blank" || { echo "::error::Pinned Wix package has no blank local template."; exit 1; }

          cd "$work"
          timeout 420s npm exec --yes --package=@wix/create-new@0.0.105 -- create-new app \
            --extend-app-id "$APP_ID" \
            --app-name "Advanced Booking Rules" \
            --template-path "$blank" \
            --skip-git >/tmp/wix-extend.log 2>&1 || {
              sed -E 's/[A-Za-z0-9_=-]{24,}/[REDACTED]/g' /tmp/wix-extend.log | tail -180 >&2
              rm -f /tmp/wix-extend.log
              exit 1
            }
          rm -f /tmp/wix-extend.log

          config=$(find "$work" -mindepth 2 -maxdepth 4 -type f -name wix.config.json -print -quit)
          test -n "$config" || { echo "::error::Existing-app scaffold completed without wix.config.json"; exit 1; }
          jq -e --arg id "$APP_ID" 'type=="object" and .appId==$id and (.projectId|type=="string" and length>0) and (.projectType|type=="string" and length>0)' "$config" >/dev/null
          if jq -e 'paths(scalars) as $p | ($p|map(tostring)|join(".")) | test("secret|token|password|api.?key";"i")' "$config" >/dev/null; then
            echo "::error::Generated wix.config.json contains a secret-like field"
            exit 1
          fi
          cp "$config" "$GITHUB_WORKSPACE/wix.config.json"
          echo "project_dir=$(dirname "$config")" >> "$GITHUB_OUTPUT"

      - name: Verify Wix-generated project with real Wix build
        if: ${{ steps.base.outputs.already_bound != 'true' }}
        env:
          PROJECT_DIR: ${{ steps.create.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          timeout 180s npx -y @wix/cli@1.1.238 build >/tmp/wix-build.log 2>&1 || {
            sed -E 's/[A-Za-z0-9_=-]{24,}/[REDACTED]/g' /tmp/wix-build.log | tail -120 >&2
            rm -f /tmp/wix-build.log
            exit 1
          }
          rm -f /tmp/wix-build.log
          echo "Real wix build passed for the recovered existing app binding."

      - name: Record non-secret binding evidence
        if: ${{ steps.base.outputs.already_bound != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/wix-live
          keys=$(jq -r 'keys|sort|join(", ")' wix.config.json)
          cat > reports/wix-live/BOOTSTRAP_BINDING.md <<EOF
          # Authenticated Wix app binding

          GitHub Actions authenticated with the protected Wix API key, resolved the already-registered **Advanced Booking Rules** app using Wix's own Dev Center client, scaffolded that exact existing app without registering a duplicate, and passed a real \`wix build\` against Wix's generated project.

          Persisted wix.config.json fields: $keys

          No API key, account auth store, token, password, patched Wix package, or other credential was persisted.
          EOF

      - name: Persist only the Wix-generated binding to accepted product branch
        if: ${{ steps.base.outputs.already_bound != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name wix-binding-bootstrap
          git config user.email wix-binding-bootstrap@users.noreply.github.com
          git add -f wix.config.json reports/wix-live/BOOTSTRAP_BINDING.md
          git commit -m "wix: persist authenticated existing-app binding"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          remote=$(git -c "http.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/lab/wix-rules | awk '{print $1}')
          test "$remote" = "$BASE_SHA" || { echo "::error::lab/wix-rules moved during Wix bootstrap"; exit 1; }
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/lab/wix-rules

      - name: Existing binding
        if: ${{ steps.base.outputs.already_bound == 'true' }}
        run: echo "Real Wix binding already exists; no bootstrap needed."
