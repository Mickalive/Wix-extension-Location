name: Wix App Binding Wizard v4

on:
  push:
    branches: [main]
    paths: [".github/workflows/wix-bootstrap-wizard-v4.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: wix-app-binding-wizard-v4
  cancel-in-progress: true

jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Cancel older bootstrap experiments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for wf in wix-bootstrap-binding.yml wix-bootstrap-wizard-v4.yml; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --limit 20 --json databaseId,status 2>/dev/null \
              | jq -r --arg current "$GITHUB_RUN_ID" '.[] | select((.status=="in_progress" or .status=="queued" or .status=="pending") and (.databaseId|tostring)!=$current) | .databaseId' \
              | while read -r id; do
                  [[ -z "$id" ]] && continue
                  echo "Cancelling stale bootstrap run $id"
                  gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" >/dev/null 2>&1 || true
                done
          done

      - name: Checkout accepted product
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: lab/wix-rules
          fetch-depth: 0
          persist-credentials: false

      - name: Pin accepted head
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          [[ -f wix.config.json ]] && echo "bound=true" >> "$GITHUB_OUTPUT" || echo "bound=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        if: ${{ steps.base.outputs.bound != 'true' }}
        with:
          node-version: 22.13.0

      - name: Authenticate Wix CLI
        if: ${{ steps.base.outputs.bound != 'true' }}
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIX_API_KEY"
          npx -y @wix/cli@1.1.238 logout >/dev/null 2>&1 || true
          npx -y @wix/cli@1.1.238 login --api-key "$WIX_API_KEY" >/tmp/wix-login.log 2>&1 || {
            sed -E 's/[A-Za-z0-9_=-]{24,}/[REDACTED]/g' /tmp/wix-login.log >&2
            exit 1
          }
          rm -f /tmp/wix-login.log

      - name: Preinstall official Wix creator and TTY driver
        if: ${{ steps.base.outputs.bound != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq expect >/dev/null
          npm install -g @wix/create-new@latest --no-audit --no-fund >/dev/null
          command -v create-new
          create-new --version || true

      - name: Drive Wix basic-app wizard
        id: create
        if: ${{ steps.base.outputs.bound != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          root=$(mktemp -d)
          mkdir -p "$root/work"
          cat > "$root/wix.exp" <<'EXPECT'
          #!/usr/bin/expect -f
          set timeout 150
          log_user 1
          cd [lindex $argv 0]
          spawn create-new app
          set stage_new 0
          set stage_basic 0
          set stage_name 0
          set stage_folder 0
          set stage_mcp 0
          set stage_ide 0
          set stage_ns 0
          set stage_code 0
          expect {
            -re {(?i)(what would you like to do|create a new wix app)} {
              if {!$stage_new} { send "\r"; set stage_new 1 }
              exp_continue
            }
            -re {(?i)(how would you like to start|create a basic app)} {
              if {!$stage_basic} { send "\r"; set stage_basic 1 }
              exp_continue
            }
            -re {(?i)(what.*name.*app|name for your app|app name)} {
              if {!$stage_name} { send "Advanced Booking Rules\r"; set stage_name 1 }
              exp_continue
            }
            -re {(?i)(folder name|project folder|name.*folder)} {
              if {!$stage_folder} { send "\r"; set stage_folder 1 }
              exp_continue
            }
            -re {(?i)(configure.*mcp|wix mcp)} {
              if {!$stage_mcp} { send "\r"; set stage_mcp 1 }
              exp_continue
            }
            -re {(?i)(which.*ide|preferred.*ide|select.*ide)} {
              if {!$stage_ide} { send "\r"; set stage_ide 1 }
              exp_continue
            }
            -re {(?i)namespace} {
              if {!$stage_ns} { send "\r"; set stage_ns 1 }
              exp_continue
            }
            -re {(?i)code identifier} {
              if {!$stage_code} { send "\r"; set stage_code 1 }
              exp_continue
            }
            -re {(?i)(success.*registered|app.*registered)} { exp_continue }
            -re {(?i)(failed to register|not_found|forbidden|unauthorized|entity not found)} {
              send_user "\nWIX_REGISTRATION_ERROR_SEEN\n"
              exp_continue
            }
            eof {
              catch wait result
              exit [lindex $result 3]
            }
            timeout {
              send_user "\nWIX_WIZARD_TIMEOUT\n"
              exit 124
            }
          }
          EXPECT
          chmod +x "$root/wix.exp"
          set +e
          timeout 180s "$root/wix.exp" "$root/work" > /tmp/wix-wizard.log 2>&1
          rc=$?
          set -e
          echo '--- Sanitized Wix wizard transcript ---'
          sed -E 's/[A-Za-z0-9_=-]{24,}/[REDACTED]/g' /tmp/wix-wizard.log | tail -160
          if (( rc != 0 )); then
            echo "::error::Wix wizard exited $rc"
            exit 1
          fi
          config=$(find "$root/work" -type f -name wix.config.json -print -quit)
          test -n "$config" || { echo "::error::No wix.config.json generated"; exit 1; }
          jq -e 'type=="object" and (.appId|type=="string" and length>0) and (.projectId|type=="string" and length>0) and (.projectType|type=="string" and length>0)' "$config" >/dev/null
          if jq -e 'paths(scalars) as $p | ($p|map(tostring)|join(".")) | test("secret|token|password|api.?key";"i")' "$config" >/dev/null; then
            echo "::error::Secret-like field found in generated binding"
            exit 1
          fi
          project_dir=$(dirname "$config")
          cp "$config" "$GITHUB_WORKSPACE/wix.config.json"
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Verify Wix-generated project
        if: ${{ steps.base.outputs.bound != 'true' }}
        env:
          PROJECT_DIR: ${{ steps.create.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          timeout 120s npx -y @wix/cli@1.1.238 build >/tmp/wix-build.log 2>&1 || {
            sed -E 's/[A-Za-z0-9_=-]{24,}/[REDACTED]/g' /tmp/wix-build.log | tail -100 >&2
            exit 1
          }
          rm -f /tmp/wix-build.log

      - name: Persist only the real non-secret binding
        if: ${{ steps.base.outputs.bound != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/wix-live
          cat > reports/wix-live/BOOTSTRAP_BINDING.md <<'EOF'
          # Authenticated Wix app binding

          Wix CLI authentication succeeded via the protected GitHub Actions secret. The official Wix basic-app wizard registered the app and generated the real non-secret project binding. The generated Wix project passed `wix build` before the binding was persisted.

          No API key, CLI auth store, token, password, or other credential is stored in the repository.
          EOF
          git config user.name wix-binding-bootstrap
          git config user.email wix-binding-bootstrap@users.noreply.github.com
          git add -f wix.config.json reports/wix-live/BOOTSTRAP_BINDING.md
          git commit -m "wix: persist authenticated app binding"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          remote=$(git -c "http.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/lab/wix-rules | awk '{print $1}')
          test "$remote" = "$BASE_SHA"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/lab/wix-rules

      - name: Existing binding
        if: ${{ steps.base.outputs.bound == 'true' }}
        run: echo 'A real wix.config.json already exists on the accepted product branch.'
