name: Wix Product Factory

'on':
  workflow_dispatch: {}
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: ["main"]
    paths:
      - ".factory/state.json"
      - ".github/workflows/**"
      - ".github/scripts/**"
      - ".github/actions/setup-opencode/**"
      - ".opencode/agents/**"
      - ".opencode/job-descriptions/**"
      - "AGENTS.md"
      - "MAIN_PROMPT.md"
      - "opencode.json"

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: wix-product-factory-${{ github.sha }}
  cancel-in-progress: false

env:
  PRODUCT_BRANCH: lab/wix-rules
  MAIN_PROMPT_SHA256: 9cdd0500552998adedbae7e2cc7605ca443187393b6299f0bf4ffdcba18c9101
  EXPECTED_WIX_APP_ID: 3e9ec3af-001b-4684-a197-a5133677844d
  WIX_CLI_VERSION: 1.1.238

jobs:
  factory:
    name: Authoritative product-state transition
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - name: Checkout exact control SHA
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate authoritative state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -e '.architecture=="lane-machine/1" and .generation>=1 and .accepted_base and .phase' .factory/state.json >/dev/null
          bash .github/scripts/housekeeping.sh
          phase="$(jq -r '.phase' .factory/state.json)"
          effective="$phase"
          if [[ "$phase" == BLOCKED_EXTERNAL ]]; then
            effective="$(jq -r '.blocked_resume_phase // empty' .factory/state.json)"
          fi
          if [[ "$phase" == READY ]]; then
            echo "final=true" >> "$GITHUB_OUTPUT"
          else
            echo "final=false" >> "$GITHUB_OUTPUT"
          fi
          case "$effective" in
            WIX_QA|RELEASE_AUDIT) echo "final_gate=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "final_gate=false" >> "$GITHUB_OUTPUT" ;;
          esac
          if [[ "$phase" == BUILD \
                && "$(jq -r '.lane // empty' .factory/state.json)" == integration \
                && "$(jq -r '.repair_feedback // empty' .factory/state.json)" == REAL_WIX_EXTENSIONS_REQUIRED:* ]]; then
            echo "real_wix_bootstrap=true" >> "$GITHUB_OUTPUT"
          else
            echo "real_wix_bootstrap=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Authoritative phase=$phase effective=$effective"

      - name: Set up Node
        if: ${{ steps.state.outputs.final != 'true' }}
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.19.0

      - name: Install reviewed OpenCode CLI
        if: ${{ steps.state.outputs.final != 'true' && steps.state.outputs.final_gate != 'true' && steps.state.outputs.real_wix_bootstrap != 'true' }}
        uses: ./.github/actions/setup-opencode

      - name: Probe and select healthy models
        if: ${{ steps.state.outputs.final != 'true' && steps.state.outputs.final_gate != 'true' && steps.state.outputs.real_wix_bootstrap != 'true' }}
        shell: bash
        run: bash .github/scripts/probe-and-select-models.sh

      - name: Generate authentic Wix extension shells
        if: ${{ steps.state.outputs.real_wix_bootstrap == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: bash .github/scripts/wix-realize-bootstrap.sh

      - name: Prepare Wix final-gate environment
        if: ${{ steps.state.outputs.final_gate == 'true' }}
        shell: bash
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: bash .github/scripts/wix-env-preflight.sh

      - name: Converge deterministic final gates
        if: ${{ steps.state.outputs.final_gate == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: bash .github/scripts/wix-finalize-fastpath.sh

      - name: Execute one agentic factory transition
        if: ${{ steps.state.outputs.final != 'true' && steps.state.outputs.final_gate != 'true' && steps.state.outputs.real_wix_bootstrap != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: bash .github/scripts/wix-factory-cycle.sh

      - name: Dispatch next logical transition
        if: ${{ success() && steps.state.outputs.final != 'true' && steps.state.outputs.final_gate != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          state="$(git show origin/main:.factory/state.json)"
          phase="$(jq -r '.phase' <<<"$state")"
          failure_reason="$(jq -r '.last_operational_failure.reason // "none"' <<<"$state")"
          echo "Latest authoritative phase: $phase; operational failure: $failure_reason"

          if [[ "$phase" == READY || "$phase" == BLOCKED_EXTERNAL ]]; then
            exit 0
          fi

          case "$failure_reason" in
            none|provider_transient|director_failed|lane_auditor_failed|integrated_auditor_failed|wix_live_auditor_failed|release_auditor_failed|invalid_lane_audit_verdict|invalid_integrated_verdict|invalid_wix_live_verdict|invalid_release_verdict|deterministic_dependency_transient|wix_build_transient) ;;
            *) echo "Non-recoverable operational failure: $failure_reason"; exit 0 ;;
          esac

          current_signature="$(jq -r '[.phase, (.lane // "none"), (.candidate.sha // "none"), (.repair_feedback // "none"), (.last_transition.reason // "none"), (.last_operational_failure.reason // "none")] | join("|")' <<<"$state")"
          repeats=0
          while IFS= read -r commit; do
            past="$(git show "$commit":.factory/state.json 2>/dev/null || true)"
            [[ -n "$past" ]] || continue
            signature="$(jq -r '[.phase, (.lane // "none"), (.candidate.sha // "none"), (.repair_feedback // "none"), (.last_transition.reason // "none"), (.last_operational_failure.reason // "none")] | join("|")' <<<"$past" 2>/dev/null || true)"
            [[ "$signature" == "$current_signature" ]] && repeats=$((repeats + 1))
          done < <(git log -n 20 --format='%H' origin/main -- .factory/state.json)

          if (( repeats >= 3 )); then
            echo "Stagnation guard: identical semantic state seen $repeats times; yielding to watchdog cooldown."
            exit 0
          fi

          gh workflow run wix-build-loop.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched next authoritative transition from phase $phase."
