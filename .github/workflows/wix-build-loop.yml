name: Wix Product Factory

'on':
  workflow_dispatch: {}
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: ["main"]
    paths:
      - ".factory/state.json"
      - ".github/workflows/wix-build-loop.yml"
      - ".github/scripts/**"
      - ".github/actions/setup-opencode/**"
      - ".opencode/agents/**"
      - ".opencode/job-descriptions/**"
      - "AGENTS.md"
      - "MAIN_PROMPT.md"
      - "opencode.json"

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: wix-product-factory-authoritative
  cancel-in-progress: false

env:
  PRODUCT_BRANCH: lab/wix-rules
  MAIN_PROMPT_SHA256: 9cdd0500552998adedbae7e2cc7605ca443187393b6299f0bf4ffdcba18c9101
  EXPECTED_WIX_APP_ID: 3e9ec3af-001b-4684-a197-a5133677844d
  WIX_CLI_VERSION: 1.1.238

jobs:
  prepare:
    name: Prepare clean authoritative cycle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      final: ${{ steps.state.outputs.final }}
    steps:
      - name: Checkout control plane
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate state and clean obsolete automation
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -e '.architecture=="lane-machine/1" and .generation>=1 and .accepted_base and .phase' .factory/state.json >/dev/null
          bash .github/scripts/housekeeping.sh
          if [[ "$(jq -r '.phase' .factory/state.json)" == READY ]]; then
            echo "final=true" >> "$GITHUB_OUTPUT"
          else
            echo "final=false" >> "$GITHUB_OUTPUT"
          fi

  model_probe:
    name: Probe OpenCode — ${{ matrix.model }}
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && needs.prepare.outputs.final != 'true' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        model:
          - x-preview-f-free
          - deepseek-v4-flash-free
          - north-mini-code-free
          - laguna-s-2.1-free
          - mimo-v2.5-free
          - nemotron-3-ultra-free
          - nemotron-3.5-lightning-free
          - hy3-free
          - big-pickle
          - ling-3.0-flash-free
          - ling-3.0-tiny-free
          - muse-spark-1.2-contributor-free
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact control SHA
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install reviewed OpenCode CLI
        uses: ./.github/actions/setup-opencode

      - name: Probe real headless tool calling
        shell: bash
        env:
          PROBE_MODEL: ${{ matrix.model }}
        run: bash .github/scripts/probe-model.sh "$PROBE_MODEL"

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wix-model-probe-${{ matrix.model }}
          path: ${{ runner.temp }}/model-probe-${{ matrix.model }}/probe.json
          if-no-files-found: error
          retention-days: 3

  select_models:
    name: Select best healthy models for current role
    needs: [prepare, model_probe]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.final != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      builder_models: ${{ steps.select.outputs.builder_models }}
      review_models: ${{ steps.select.outputs.review_models }}
      selection_b64: ${{ steps.select.outputs.selection_b64 }}
      healthy_count: ${{ steps.select.outputs.healthy_count }}
    steps:
      - name: Checkout exact control SHA
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download all model probes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/wix-model-probes
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -p 'wix-model-probe-*' -D /tmp/wix-model-probes

      - name: Select role-specific chains
        id: select
        shell: bash
        run: bash .github/scripts/select-models.sh /tmp/wix-model-probes .factory/state.json .factory/evidence

      - name: Upload selection audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wix-model-selection
          path: ${{ runner.temp }}/wix-model-selection/selection.json
          if-no-files-found: error
          retention-days: 7

  transition:
    name: One authoritative product-state transition
    needs: [prepare, select_models]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.final != 'true' && needs.select_models.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OX_BUILDER_MODELS: ${{ needs.select_models.outputs.builder_models }}
      OX_REVIEW_MODELS: ${{ needs.select_models.outputs.review_models }}
    steps:
      - name: Checkout exact control SHA
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0

      - name: Install reviewed OpenCode CLI
        uses: ./.github/actions/setup-opencode

      - name: Prepare current evidence chain
        shell: bash
        env:
          MODEL_SELECTION_B64: ${{ needs.select_models.outputs.selection_b64 }}
        run: |
          set -euo pipefail
          phase="$(jq -r '.phase' .factory/state.json)"
          if [[ "$phase" == BUILD ]]; then
            feedback="$(jq -r '.repair_feedback // ""' .factory/state.json)"
            if [[ "$feedback" == "Real Wix CLI build failed; inspect factory evidence." ]]; then
              failure_file="$(find .factory/evidence -maxdepth 1 -type f -name 'run_*_wix_build_failure.txt' | sort -V | tail -n1)"
              if [[ -n "$failure_file" ]]; then
                failure="$(tail -c 10000 "$failure_file")"
                jq --arg f "Real Wix CLI build failed:\n$failure" '.repair_feedback=$f' .factory/state.json > .factory/state.tmp
                mv .factory/state.tmp .factory/state.json
              fi
            fi
            rm -rf .factory/evidence
            mkdir -p .factory/evidence
          fi
          printf '%s' "$MODEL_SELECTION_B64" | base64 -d > ".factory/evidence/run_${GITHUB_RUN_ID}_model_selection.json"
          jq -e '.schemaVersion==2 and .healthyCount>=1 and .current.builderChain and .current.reviewChain' ".factory/evidence/run_${GITHUB_RUN_ID}_model_selection.json" >/dev/null

      - name: Execute exactly one factory transition
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: bash .github/scripts/wix-factory-cycle.sh

      - name: Dispatch next logical transition
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          state="$(git show origin/main:.factory/state.json)"
          phase="$(jq -r '.phase' <<<"$state")"
          operational_failure="$(jq -r 'if .last_operational_failure == null then "none" else "present" end' <<<"$state")"
          echo "Latest authoritative phase: $phase; operational failure: $operational_failure"
          if [[ "$phase" == READY || "$phase" == BLOCKED_EXTERNAL || "$operational_failure" == present ]]; then
            echo "No immediate self-dispatch; terminal/external/operational state will be handled by normal policy."
            exit 0
          fi
          gh workflow run wix-build-loop.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched next authoritative transition from phase $phase."
