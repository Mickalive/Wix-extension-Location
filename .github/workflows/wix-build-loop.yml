name: Wix Product Factory

'on':
  workflow_dispatch:
    inputs:
      cycle_index:
        description: Monotonic product cycle number
        required: false
        default: "1"
        type: string
      recovery_note:
        description: Evidence carried from the previous cycle
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: wix-product-factory-v4
  cancel-in-progress: false

env:
  CONTROL_PROTOCOL: "4"
  OX_MODEL: opencode/x-preview-f-free
  PRODUCT_BRANCH: lab/wix-rules
  MAIN_PROMPT_SHA256: 9cdd0500552998adedbae7e2cc7605ca443187393b6299f0bf4ffdcba18c9101
  EXPECTED_WIX_APP_ID: 3e9ec3af-001b-4684-a197-a5133677844d
  WIX_CLI_VERSION: 1.1.238
  WIX_MCP_VERSION: 1.0.71
  CI: "true"

jobs:
  cycle:
    name: One leased product cycle
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    outputs:
      verdict: ${{ steps.result.outputs.verdict }}
      reason: ${{ steps.result.outputs.reason }}
      persisted_cycle: ${{ steps.result.outputs.persisted_cycle }}
    steps:
      - name: Checkout immutable control plane
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0

      - name: Set up reviewed OpenCode
        id: opencode
        continue-on-error: true
        uses: ./.github/actions/setup-opencode

      - name: Acquire accepted-state lease
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE_INDEX: ${{ inputs.cycle_index }}
          RECOVERY_NOTE: ${{ inputs.recovery_note }}
        run: bash .github/scripts/wix-factory-cycle.sh prepare

      - name: Build, independently audit, preview, simulate and cross-audit
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE_INDEX: ${{ inputs.cycle_index }}
          RECOVERY_NOTE: ${{ inputs.recovery_note }}
        run: bash .github/scripts/wix-factory-cycle.sh build

      - name: Privileged Wix CLI gate
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: bash .github/scripts/wix-factory-cycle.sh wix-live

      - name: Wix MCP audit without secret in agent environment
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_CONFIG_CONTENT: >-
            {"mcp":{"wix":{"type":"local","command":["npx","-y","@wix/mcp@1.0.71","--wixCliAuth"],"enabled":true,"timeout":30000}}}
        run: bash .github/scripts/wix-factory-cycle.sh wix-mcp

      - name: Director, final auditor and atomic accepted-state persistence
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE_INDEX: ${{ inputs.cycle_index }}
          RECOVERY_NOTE: ${{ inputs.recovery_note }}
        run: bash .github/scripts/wix-factory-cycle.sh finish

      - name: Export deterministic cycle result
        id: result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          state="${RUNNER_TEMP}/wix-factory-${GITHUB_RUN_ID}/result.env"
          verdict=CONTINUE
          reason=cycle_did_not_publish_result
          persisted_cycle="${{ inputs.cycle_index }}"
          if [[ -f "$state" ]]; then
            # shellcheck disable=SC1090
            source "$state"
          fi
          [[ "$verdict" == READY || "$verdict" == CONTINUE ]] || verdict=CONTINUE
          printf 'verdict=%s\nreason=%s\npersisted_cycle=%s\n' "$verdict" "$reason" "$persisted_cycle" >> "$GITHUB_OUTPUT"
          echo "Factory result: $verdict ($reason), cycle $persisted_cycle"

  controller:
    name: Fresh-cycle controller
    needs: [cycle]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Stop only on independently proven READY; otherwise enqueue one fresh run
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_BRANCH: lab/wix-rules
          EXPECTED_WIX_APP_ID: 3e9ec3af-001b-4684-a197-a5133677844d
          CONTROL_PROTOCOL: "4"
          FACTORY_WORKFLOW: wix-build-loop.yml
          PRIOR_REASON: ${{ needs.cycle.outputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          read_product_file() {
            gh api "repos/$repo/contents/$1?ref=$PRODUCT_BRANCH" --jq '.content' 2>/dev/null |
              tr -d '\n' | base64 -d 2>/dev/null || true
          }

          ready="$(read_product_file reports/release/READY.json)"
          if [[ -n "$ready" ]] &&
             [[ "$(jq -r '.verdict // empty' <<<"$ready")" == READY ]] &&
             [[ "$(jq -r '.app_id // empty' <<<"$ready")" == "$EXPECTED_WIX_APP_ID" ]] &&
             [[ "$(jq -r '.protocol // empty' <<<"$ready")" == "$CONTROL_PROTOCOL" ]]; then
            echo "READY is independently proven for the bound Wix app."
            exit 0
          fi

          current_main="$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "Control plane advanced from $GITHUB_SHA to $current_main; watchdog owns the clean handoff."
            exit 0
          fi

          runs="$(gh api --paginate "repos/$repo/actions/workflows/$FACTORY_WORKFLOW/runs?per_page=100" --jq '.workflow_runs[]' 2>/dev/null | jq -s '.')"
          other_current="$(jq --arg sha "$current_main" --argjson self "$GITHUB_RUN_ID" \
            '[.[] | select(.head_sha==$sha and .status!="completed" and .id!=$self)] | length' <<<"$runs")"
          if (( other_current > 0 )); then
            echo "A fresh current-head Factory is already queued or running."
            exit 0
          fi

          state="$(read_product_file docs/state.json)"; [[ -n "$state" ]] || state='{}'
          cycle="$(jq -r '.cycle // 0' <<<"$state")"; [[ "$cycle" =~ ^[0-9]+$ ]] || cycle=0
          next=$((cycle + 1))
          note="Fresh cycle after run ${GITHUB_RUN_ID}. Prior result: ${PRIOR_REASON:-unknown}. Resume only from the current accepted product branch; never rerun this workflow attempt."
          gh workflow run "$FACTORY_WORKFLOW" --repo "$repo" --ref main \
            -f cycle_index="$next" -f recovery_note="$note"
          echo "Enqueued fresh Product Factory cycle $next."
