name: Wix CLI Registration Internals Inspect

on:
  push:
    branches: [main]
    paths: [".github/workflows/wix-cli-internals-inspect.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0
      - name: Inspect public Wix npm packages used for app registration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wix-inspect && cd /tmp/wix-inspect
          echo '=== PACKAGE METADATA ==='
          for p in '@wix/create-new' '@wix/create-new-packages' '@wix/create-new-packages/app-command' '@wix/dev-center-client'; do
            echo "--- $p ---"
            npm view "$p" version dist.tarball dependencies optionalDependencies 2>&1 || true
          done

          echo '=== PACK + SEARCH ==='
          packages=( '@wix/create-new' '@wix/create-new-packages/app-command' '@wix/dev-center-client' )
          i=0
          for p in "${packages[@]}"; do
            i=$((i+1))
            d="pkg$i"
            mkdir "$d" && cd "$d"
            tgz=$(npm pack "$p@latest" --silent 2>/dev/null || true)
            if [[ -z "$tgz" || ! -f "$tgz" ]]; then
              echo "PACK_FAILED $p"
              cd ..
              continue
            fi
            tar -xzf "$tgz"
            echo "--- FILES $p ---"
            find package -maxdepth 4 -type f | head -80
            echo "--- REGISTRATION HITS $p ---"
            grep -RInE --exclude='*.map' --exclude='*.d.ts' \
              'Create a basic app|createAppFromTemplate|app-templates-service|register.*app|create.*app|accountId|account.?id|DevCenterClient|templateId' \
              package 2>/dev/null | head -240 || true
            echo "--- SOURCE MAP HITS $p ---"
            grep -RIlE 'createAppFromTemplate|useAppCreation|Create a basic app|app-templates-service' package 2>/dev/null | head -30 || true
            cd ..
          done
