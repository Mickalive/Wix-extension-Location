name: Wix Direct Create Primitive Inspect

on:
  push:
    branches: [main]
    paths: [".github/workflows/wix-direct-create-inspect.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0
      - name: Extract direct basic-app registration code
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cd "$work"
          tgz=$(npm pack @wix/create-new@0.0.105 --silent)
          tar -xzf "$tgz"
          f=package/build/index.js
          echo '=== CREATEAPP CALL SITES ==='
          grep -nE 'createApp = async|function createApp\(|protoPath:.*create-app|srcPath:.*dev|createApp\(\{ app \}\)' "$f" | head -80
          echo '=== DEV CENTER CLIENT CREATEAPP CONTEXT ==='
          sed -n '80435,80480p' "$f"
          echo '=== BASIC APP FLOW CONTEXT ==='
          sed -n '82450,82482p' "$f"
          echo '=== AMBASSADOR CREATEAPP CONTEXTS ==='
          while IFS=: read -r n rest; do
            start=$((n-18)); (( start < 1 )) && start=1
            end=$((n+28))
            echo "--- around line $n ---"
            sed -n "${start},${end}p" "$f"
          done < <(grep -nE 'function createApp\(|protoPath:.*create-app' "$f" | head -12)
          echo '=== HTTP CLIENT / AUTH CONTEXT ==='
          sed -n '49535,49595p' "$f"
