name: Wix Inspect DevCenter Client

on:
  push:
    branches: [main]
    paths: [".github/workflows/wix-inspect-devcenter.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0
      - name: Inspect public Dev Center client package
        shell: bash
        run: |
          set -u
          d=$(mktemp -d)
          cd "$d"
          npm pack @wix/dev-center-client --silent >/tmp/pkgname
          pkg=$(cat /tmp/pkgname)
          tar -xzf "$pkg"
          echo '--- files ---'
          find package -maxdepth 4 -type f | sort | head -n 200
          echo '--- create method context ---'
          grep -Rni 'createAppFromTemplate' package 2>/dev/null | head -n 50 || true
          echo '--- declarations / methods ---'
          grep -RniE 'class DevCenterClient|AppFromTemplate|Apps\(|App\(' package 2>/dev/null | head -n 300 || true
