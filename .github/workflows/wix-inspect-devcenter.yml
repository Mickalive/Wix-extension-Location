name: Wix Inspect DevCenter Client

on:
  push:
    branches: [main]
    paths: [".github/workflows/wix-inspect-devcenter.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0
      - name: Inspect DevCenter client endpoint surface
        shell: bash
        run: |
          set -u
          d=$(mktemp -d)
          cd "$d"
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund @wix/create-new@0.0.105 >/dev/null 2>&1 || true
          js=node_modules/@wix/dev-center-client/dist/src/dev-center-client.js
          dts=node_modules/@wix/dev-center-client/dist/src/dev-center-client.d.ts
          echo '--- public declarations ---'
          sed -n '1,260p' "$dts" 2>/dev/null || true
          echo '--- URL literals ---'
          grep -nE 'baseURL|url:|/v[0-9]/|/apps|app-def|app-template|dev-center' "$js" 2>/dev/null | head -n 600 || true
          echo '--- getAppInfo implementation ---'
          grep -n -A35 -B10 'getAppInfo' "$js" 2>/dev/null | head -n 220 || true
          echo '--- createAppFromTemplate implementation ---'
          grep -n -A55 -B15 'createAppFromTemplate' "$js" 2>/dev/null | head -n 260 || true
          echo '--- all async/member methods ---'
          grep -nE '^  [A-Za-z0-9_]+\(|^  async [A-Za-z0-9_]+' "$js" 2>/dev/null | head -n 400 || true
          exit 0
