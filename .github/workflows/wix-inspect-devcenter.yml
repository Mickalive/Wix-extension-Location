name: Wix Inspect DevCenter Client

on:
  push:
    branches: [main]
    paths: [".github/workflows/wix-inspect-devcenter.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0
      - name: Inspect exact DevCenter client
        shell: bash
        run: |
          set -u
          d=$(mktemp -d)
          cd "$d"
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund @wix/create-new@0.0.105 >/dev/null 2>&1
          echo '--- dependency resolution ---'
          npm ls @wix/dev-center-client --all 2>&1 || true
          echo '--- exact files ---'
          find node_modules -type f -path '*/@wix/dev-center-client/*' -print 2>/dev/null | head -n 100 || true
          echo '--- createAppFromTemplate only ---'
          grep -Rni -C 15 'createAppFromTemplate' node_modules/@wix node_modules/.pnpm 2>/dev/null | head -n 300 || true
          echo '--- app lookup method names only ---'
          grep -RniE 'getAppInfo|list[A-Za-z]*Apps|query[A-Za-z]*Apps|search[A-Za-z]*Apps|app-definitions|app-templates-service' node_modules/@wix node_modules/.pnpm 2>/dev/null | head -n 400 || true
          exit 0
