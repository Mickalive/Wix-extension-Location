name: Wix Route Probe

on:
  push:
    branches:
      - factory/real-wix-finalization
    paths:
      - .wix-route-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WIX_CLI_VERSION: 1.1.245
      WIX_SITE_ID: 4d7e75bf-b6ff-4b77-801f-a38e8458b272
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.19.0
          check-latest: false
      - name: Authenticate and select installed site
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          set -euo pipefail
          npx -y "@wix/cli@${WIX_CLI_VERSION}" login --api-key "$WIX_API_KEY" >/dev/null
          rm -f .env.local
          npx -y "@wix/cli@${WIX_CLI_VERSION}" dev-site select "$WIX_SITE_ID"
          printf 'WIX_SITE_ID=%s\n' "$WIX_SITE_ID" > .env.local
          npx -y "@wix/cli@${WIX_CLI_VERSION}" env pull
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Probe application routes
        run: |
          set -euo pipefail
          : > /tmp/wix-dev.log
          timeout 120s script -q -f -c "npx -y @wix/cli@${WIX_CLI_VERSION} dev" /tmp/wix-dev.log >/dev/null 2>&1 &
          pid=$!
          base=''
          for i in $(seq 1 50); do
            base="$(grep -aoE 'http://(localhost|127\.0\.0\.1):[0-9]+/' /tmp/wix-dev.log | tail -1 | tr -d '\r' || true)"
            if [ -n "$base" ]; then break; fi
            sleep 2
          done
          test -n "$base"
          echo "Runtime $base"
          code="$(curl -sS -o /tmp/rules.json -w '%{http_code}' -H "wix-site-id: $WIX_SITE_ID" "${base}api/ruleset" || true)"
          echo "GET ruleset HTTP $code"
          cat /tmp/rules.json || true
          meter="$(curl -sS -o /tmp/meter.json -w '%{http_code}' -H "wix-site-id: $WIX_SITE_ID" "${base}api/meter" || true)"
          echo "GET meter HTTP $meter"
          cat /tmp/meter.json || true
          echo '--- runtime tail ---'
          tail -100 /tmp/wix-dev.log || true
          kill "$pid" 2>/dev/null || true
          test "$code" = 200
          test "$meter" = 200
