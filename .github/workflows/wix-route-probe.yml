name: Wix Functional Preview

on:
  push:
    branches:
      - factory/real-wix-finalization
    paths:
      - .wix-route-probe

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WIX_CLI_VERSION: 1.1.245
      WIX_SITE_ID: 4d7e75bf-b6ff-4b77-801f-a38e8458b272
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.19.0
          check-latest: false

      - name: Authenticate and select installed development site
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$WIX_API_KEY"
          npx -y "@wix/cli@${WIX_CLI_VERSION}" login --api-key "$WIX_API_KEY" >/dev/null
          rm -f .env.local
          npx -y "@wix/cli@${WIX_CLI_VERSION}" dev-site select "$WIX_SITE_ID"
          npx -y "@wix/cli@${WIX_CLI_VERSION}" dev-site current
          npx -y "@wix/cli@${WIX_CLI_VERSION}" env pull

      - name: Install dependencies and sync types
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx astro sync

      - name: Deterministic checks
        run: npm run check

      - name: Real Wix build
        run: npx -y "@wix/cli@${WIX_CLI_VERSION}" build

      - name: Create hosted Wix preview
        run: |
          set -euo pipefail
          npx -y "@wix/cli@${WIX_CLI_VERSION}" preview 2>&1 | tee /tmp/wix-preview.log
          echo '--- Preview URLs ---'
          grep -Eo 'https://[^[:space:]]+' /tmp/wix-preview.log || true
