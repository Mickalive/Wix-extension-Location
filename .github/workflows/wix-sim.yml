name: Wix Simulated Acceptance Environment

on:
  workflow_call:
    inputs:
      source_run_id:
        description: "Product Factory run whose candidates are under simulation"
        required: true
        type: string
      cycle_index:
        description: "Product cycle index"
        required: true
        type: string
    outputs:
      verdict:
        description: "PASS, FAIL, or INCONCLUSIVE"
        value: ${{ jobs.simulate.outputs.verdict }}
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Existing Product Factory run id to simulate"
        required: true
        type: string
      cycle_index:
        description: "Product cycle index"
        required: true
        type: string
        default: "1"

permissions:
  contents: write

env:
  OX_MODEL: opencode/x-preview-f-free
  LANE_BRANCH: lab/wix-rules
  MAIN_PROMPT_SHA256: 9cdd0500552998adedbae7e2cc7605ca443187393b6299f0bf4ffdcba18c9101

jobs:
  simulate:
    name: Adversarial simulated Wix runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      verdict: ${{ steps.validate.outputs.verdict }}
    steps:
      - name: Checkout persistent accepted state
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          ref: lab/wix-rules
          persist-credentials: false

      - name: Verify constitution and build phase
        id: base
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.source_run_id }}" =~ ^[0-9]+$ ]]
          [[ "${{ inputs.cycle_index }}" =~ ^[1-9][0-9]*$ ]]
          printf '%s  MAIN_PROMPT.md\n' "$MAIN_PROMPT_SHA256" | sha256sum --check --strict
          test "$(jq -r '.phase' docs/state.json)" = build
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mount all candidate and audit snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          for role in integration rules dashboard billing; do
            for kind in "$role" "audit-$role"; do
              branch="cycle/wix-build/${SOURCE_RUN_ID}/${kind}"
              git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch origin "$branch:refs/remotes/origin/$branch"
              git worktree add --detach "/tmp/wix_${kind}" "origin/$branch"
            done
          done

      - name: Assemble combined candidate without trusting audit verdicts
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wix_sim_evidence
          git worktree add --detach /tmp/wix_sim_under_test "$BASE_SHA"
          : > /tmp/wix_sim_evidence/assembly.log
          for role in integration rules dashboard billing; do
            candidate=$(git -C "/tmp/wix_${role}" rev-parse HEAD)
            patch="/tmp/wix_sim_evidence/${role}.patch"
            git diff --binary "$BASE_SHA" "$candidate" > "$patch"
            if [[ ! -s "$patch" ]]; then
              echo "$role: no diff" >> /tmp/wix_sim_evidence/assembly.log
              continue
            fi
            if git -C /tmp/wix_sim_under_test apply --check "$patch" >/dev/null 2>&1; then
              git -C /tmp/wix_sim_under_test apply "$patch"
              echo "$role: applied cleanly" >> /tmp/wix_sim_evidence/assembly.log
            else
              echo "$role: PATCH_CONFLICT_OR_CROSS_LANE_INCOMPATIBILITY" >> /tmp/wix_sim_evidence/assembly.log
            fi
          done
          git -C /tmp/wix_sim_under_test status --short >> /tmp/wix_sim_evidence/assembly.log

      - name: Set up Node
        uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: 22.13.0

      - name: Run deterministic baseline against combined candidate
        shell: bash
        run: |
          set -u
          root=/tmp/wix_sim_under_test
          evidence=/tmp/wix_sim_evidence
          install=127; test_status=127; type_status=127; build_status=127
          if [[ -f "$root/package-lock.json" ]]; then
            npm --prefix "$root" ci --ignore-scripts --no-audit --no-fund >"$evidence/npm-ci.log" 2>&1
            install=$?
          elif [[ -f "$root/package.json" ]]; then
            npm --prefix "$root" install --ignore-scripts --no-audit --no-fund >"$evidence/npm-install.log" 2>&1
            install=$?
          fi
          if [[ $install -eq 0 && -f "$root/package.json" ]]; then
            if node -e 'const p=require(process.argv[1]); process.exit(p.scripts?.test?0:1)' "$root/package.json"; then
              npm --prefix "$root" test >"$evidence/test.log" 2>&1; test_status=$?
            fi
            if node -e 'const p=require(process.argv[1]); process.exit(p.scripts?.typecheck?0:1)' "$root/package.json"; then
              npm --prefix "$root" run typecheck >"$evidence/typecheck.log" 2>&1; type_status=$?
            fi
            if node -e 'const p=require(process.argv[1]); process.exit(p.scripts?.build?0:1)' "$root/package.json"; then
              npm --prefix "$root" run build >"$evidence/build.log" 2>&1; build_status=$?
            fi
          fi
          jq -n --argjson install "$install" --argjson test "$test_status" --argjson typecheck "$type_status" --argjson build "$build_status" \
            '{install:$install,test:$test,typecheck:$typecheck,build:$build}' > "$evidence/baseline-status.json"
          exit 0

      - name: Set up reviewed OpenCode
        uses: ./.github/actions/setup-opencode

      - name: Simulate Wix Bookings behavior adversarially
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          CYCLE_INDEX: ${{ inputs.cycle_index }}
          OPENCODE_RETRY_LABEL: wix-simulation
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/run-opencode-with-retry.sh opencode run --model "$OX_MODEL" --agent wix-simulation-auditor "Simulate Wix acceptance for Product Factory run $SOURCE_RUN_ID, cycle $CYCLE_INDEX. Combined product worktree: /tmp/wix_sim_under_test. Raw deterministic evidence: /tmp/wix_sim_evidence. Candidate worktrees: /tmp/wix_integration, /tmp/wix_rules, /tmp/wix_dashboard, /tmp/wix_billing. Independent audits: /tmp/wix_audit-integration, /tmp/wix_audit-rules, /tmp/wix_audit-dashboard, /tmp/wix_audit-billing. Execute the mandatory scenario families that are locally meaningful, build extra temporary fixtures under /tmp as needed, and write reports/simulation/CYCLE_${SOURCE_RUN_ID}.md plus .json. Do not modify product code."

      - name: Validate simulator evidence contract
        id: validate
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          json="reports/simulation/CYCLE_${SOURCE_RUN_ID}.json"
          md="reports/simulation/CYCLE_${SOURCE_RUN_ID}.md"
          test -f "$json" && test -f "$md"
          verdict=$(jq -er '.verdict | select(. == "PASS" or . == "FAIL" or . == "INCONCLUSIVE")' "$json")
          jq -e --arg r "$SOURCE_RUN_ID" '.source_run_id == $r and .combined_candidate == true and (.scenarios|type=="array") and (.blockers|type=="array") and (.live_wix_gates|type=="array") and (.commands|type=="array")' "$json" >/dev/null
          jq -e '[.scenarios[] | select((.status != "PASS" and .status != "FAIL" and .status != "DEFERRED_LIVE_WIX" and .status != "NOT_APPLICABLE") or (.severity != "critical" and .severity != "high" and .severity != "medium" and .severity != "low" and .severity != "none") or (.lanes|type != "array") or (.evidence|type != "array") or (.finding|type != "string"))] | length == 0' "$json" >/dev/null
          jq -e '[.blockers[] | select((.severity != "critical" and .severity != "high") or (.lanes|type != "array" or length==0) or (.finding|type != "string" or length==0) or (.repair_acceptance|type != "array" or length==0))] | length == 0' "$json" >/dev/null
          jq -e '[.blockers[].lanes[]? | select(. != "integration" and . != "rules" and . != "dashboard" and . != "billing")] | length == 0' "$json" >/dev/null
          blockers=$(jq '.blockers|length' "$json")
          if [[ "$verdict" == PASS ]]; then (( blockers == 0 )); fi
          if [[ "$verdict" == FAIL ]]; then (( blockers > 0 )); fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Persist immutable simulation snapshot for the Director
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          BRANCH: cycle/wix-build/${{ inputs.source_run_id }}/simulation
        shell: bash
        run: |
          set -euo pipefail
          unexpected=0
          while IFS= read -r -d '' path; do
            [[ "$path" == "reports/simulation/CYCLE_${SOURCE_RUN_ID}.md" || "$path" == "reports/simulation/CYCLE_${SOURCE_RUN_ID}.json" ]] || { echo "::error::Unexpected simulator path: $path"; unexpected=1; }
          done < <({ git diff --name-only -z; git diff --cached --name-only -z; git ls-files --others --exclude-standard -z; })
          test "$unexpected" -eq 0
          printf '%s  MAIN_PROMPT.md\n' "$MAIN_PROMPT_SHA256" | sha256sum --check --strict
          git config user.name "wix-simulation-auditor"
          git config user.email "wix-simulation-auditor@users.noreply.github.com"
          git switch -C "$BRANCH" "$BASE_SHA"
          git add -- reports/simulation
          git commit --allow-empty -m "Wix build ${SOURCE_RUN_ID}: simulated acceptance evidence"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push --force origin "HEAD:refs/heads/$BRANCH"
