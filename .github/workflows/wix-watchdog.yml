name: Wix Autonomous Recovery Watchdog
# READY is the only normal terminal product state.
# A persistent supervisor heals every 5 minutes; a separate scheduled heartbeat
# only recreates that supervisor if it disappears, so cron never kills healthy work.
# Cleanup is continuous: obsolete Actions runs and completed cycle branches are ephemeral.

on:
  push:
    branches: [main]
    paths: [".github/workflows/wix-watchdog.yml", ".github/scripts/recover-transient-opencode.sh"]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    name: Prune obsolete automation state
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Delete obsolete completed Actions runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          runs=$(gh api --paginate "repos/$repo/actions/runs?per_page=100" --jq '.workflow_runs[]' | jq -s '.')
          keep_file=$(mktemp)
          trap 'rm -f "$keep_file"' EXIT

          # Never touch queued/running/waiting work.
          jq -r '.[] | select(.status != "completed") | .id' <<<"$runs" >> "$keep_file"

          keep_latest() {
            local path="$1" count="$2"
            jq -r --arg p "$path" --argjson n "$count" \
              '[.[] | select(.path == $p and .status == "completed")] | sort_by(.created_at) | reverse | .[:$n] | .[].id' \
              <<<"$runs" >> "$keep_file"
          }

          # Minimal useful evidence only. Accepted product evidence lives on lab/wix-rules.
          keep_latest '.github/workflows/wix-build-loop.yml' 2
          keep_latest '.github/workflows/ci.yml' 1
          keep_latest '.github/workflows/wix-sim.yml' 1
          keep_latest '.github/workflows/wix-watchdog.yml' 2
          sort -u "$keep_file" -o "$keep_file"

          deleted=0
          while IFS=$'\t' read -r id status path name conclusion; do
            [[ "$status" == completed ]] || continue
            grep -qx "$id" "$keep_file" && continue
            echo "Deleting obsolete run $id | $name | $conclusion | $path"
            if gh api --method DELETE "repos/$repo/actions/runs/$id" >/dev/null 2>&1; then
              deleted=$((deleted + 1))
            fi
          done < <(jq -r '.[] | [.id,.status,.path,.name,(.conclusion // "")] | @tsv' <<<"$runs")
          echo "Deleted $deleted obsolete completed Actions runs."

      - name: Delete completed cycle branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          # A cycle branch is protected only while its owning Factory run is live.
          active_ids=$(gh run list --repo "$repo" --workflow wix-build-loop.yml --limit 100 \
            --json databaseId,status \
            | jq -r '.[] | select(.status != "completed") | .databaseId' | sort -u)

          deleted=0
          while IFS= read -r branch; do
            [[ "$branch" == cycle/wix-build/* ]] || continue
            run_id=$(awk -F/ '{print $3}' <<<"$branch")
            [[ "$run_id" =~ ^[0-9]+$ ]] || continue
            if grep -qx "$run_id" <<<"$active_ids"; then
              echo "Keeping active cycle branch: $branch"
              continue
            fi
            echo "Deleting obsolete cycle branch: $branch"
            if gh api --method DELETE "repos/$repo/git/refs/heads/$branch" >/dev/null 2>&1; then
              deleted=$((deleted + 1))
            fi
          done < <(gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name')
          echo "Deleted $deleted obsolete cycle branches."

  heartbeat:
    name: Ensure persistent supervisor exists
    needs: cleanup
    if: ${{ github.event_name == 'schedule' && always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Recreate supervisor only if absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          current="$GITHUB_RUN_ID"
          active=$(gh run list --repo "$repo" --workflow wix-watchdog.yml --limit 30 \
            --json databaseId,status,event \
            | jq --arg current "$current" '[.[] | select((.status == "in_progress" or .status == "queued" or .status == "pending") and .event != "schedule" and ((.databaseId|tostring) != $current))] | length')
          if (( active > 0 )); then
            echo "Persistent supervisor already exists; heartbeat is a no-op."
            exit 0
          fi
          gh workflow run wix-watchdog.yml --repo "$repo" --ref main
          echo "Persistent supervisor was absent; replacement dispatched."

  supervise:
    name: Persistent autonomous supervisor — 5 minute control loop
    needs: cleanup
    if: ${{ github.event_name != 'schedule' && always() }}
    concurrency:
      group: wix-autonomous-recovery-persistent-v4
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Inspect and heal Product Factory every five minutes
        env:
          GH_TOKEN: ${{ github.token }}
          WIX_LOOP_WORKFLOW: wix-build-loop.yml
        shell: bash
        run: |
          set -u -o pipefail
          rm -f /tmp/wix-product-ready

          sanitize_accepted_lane() {
            local repo="$GITHUB_REPOSITORY"
            local lane="lab/wix-rules"
            local auth base remote tmp
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            base=$(git -c "http.extraheader=AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$lane" | awk '{print $1}')
            [[ -n "$base" ]] || return 0
            git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch origin "$lane:refs/remotes/origin/$lane" --quiet || return 0
            tmp=$(mktemp -d)
            git worktree add --detach "$tmp" "$base" >/dev/null 2>&1 || { rm -rf "$tmp"; return 0; }

            # The accepted product branch owns product state and its deterministic CI only.
            # Orchestration/recon/simulation/watchdog live exclusively on main.
            rm -f \
              "$tmp/.github/workflows/wix-recon.yml" \
              "$tmp/.github/workflows/wix-build-loop.yml" \
              "$tmp/.github/workflows/wix-sim.yml" \
              "$tmp/.github/workflows/wix-watchdog.yml"

            if [[ -n "$(git -C "$tmp" status --porcelain -- .github/workflows)" ]]; then
              git -C "$tmp" config user.name wix-automation-sanitizer
              git -C "$tmp" config user.email wix-automation-sanitizer@users.noreply.github.com
              git -C "$tmp" add -A .github/workflows
              git -C "$tmp" commit -m "chore: keep orchestration workflows off accepted product lane" >/dev/null
              remote=$(git -c "http.extraheader=AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$lane" | awk '{print $1}')
              if [[ "$remote" == "$base" ]]; then
                git -C "$tmp" -c "http.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$lane" >/dev/null
                echo "Sanitized accepted lane workflows at $(git -C "$tmp" rev-parse HEAD)."
              else
                echo "Accepted lane moved during sanitation; leaving it untouched this tick."
              fi
            fi
            git worktree remove --force "$tmp" >/dev/null 2>&1 || true
            rm -rf "$tmp"
          }

          for tick in $(seq 1 70); do
            echo "=== autonomous supervisor tick $tick/70 at $(date -u +%FT%TZ) ==="
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch origin main --quiet || true

            factory_active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WIX_LOOP_WORKFLOW" --limit 50 \
              --json status | jq '[.[] | select(.status != "completed")] | length')
            if (( factory_active == 0 )); then
              sanitize_accepted_lane
            fi

            if git show origin/main:.github/scripts/recover-transient-opencode.sh > /tmp/recover.sh 2>/dev/null; then
              chmod +x /tmp/recover.sh
              set +e
              # Job-level concurrency already guarantees one persistent v4 supervisor.
              # Remove GITHUB_RUN_ID so scheduled heartbeat runs cannot confuse legacy guards.
              env -u GITHUB_RUN_ID bash /tmp/recover.sh
              rc=$?
              set -e
              if (( rc == 10 )); then
                echo "READY release evidence confirmed. Supervisor terminal condition reached."
                touch /tmp/wix-product-ready
                break
              elif (( rc != 0 )); then
                echo "::warning::Recovery router returned $rc; supervisor remains alive and will inspect again."
              fi
            else
              echo "::warning::Could not refresh recovery router; supervisor remains alive."
            fi
            if (( tick < 70 )); then sleep 300; fi
          done

      - name: Hand off before runner timeout unless READY
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/wix-product-ready ]]; then
            echo "Product READY: no further watchdog handoff required."
            exit 0
          fi
          gh workflow run wix-watchdog.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Fresh persistent supervisor dispatched before runner timeout."
