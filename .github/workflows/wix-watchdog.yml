name: Wix Factory Watchdog

'on':
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

concurrency:
  group: wix-factory-watchdog
  cancel-in-progress: true

jobs:
  liveness:
    name: Short liveness check only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout current control plane
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Dispatch factory only when needed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          phase="$(jq -r '.phase' .factory/state.json)"
          if [[ "$phase" == READY ]]; then
            echo "Factory is READY; watchdog exits."
            exit 0
          fi

          active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow wix-build-loop.yml --limit 20 --json status,headSha,databaseId --jq '[.[] | select((.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending") and .headSha==env.GITHUB_SHA)] | length')"
          if [[ "$active" != "0" ]]; then
            echo "Current control SHA already has an active factory run."
            exit 0
          fi

          echo "No active factory for current SHA; dispatching one transition."
          gh workflow run wix-build-loop.yml --repo "$GITHUB_REPOSITORY" --ref main
