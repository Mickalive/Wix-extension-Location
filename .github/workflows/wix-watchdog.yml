name: Wix Autonomous Recovery Watchdog

on:
  workflow_run:
    workflows:
      - "Wix Autonomous Product Factory"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: wix-autonomous-recovery-watchdog
  cancel-in-progress: false

jobs:
  recover:
    name: Recover transient Product Factory failure
    if: ${{ github.repository == 'Mickalive/Wix-extension-Location' && !github.event.repository.fork && ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 1
          ref: main
          persist-credentials: false
      - name: Allow transient provider or runner outage to clear
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 300
      - name: Re-run only proven transient or runner failures
        env:
          GH_TOKEN: ${{ github.token }}
          WIX_LOOP_WORKFLOW: wix-build-loop.yml
        run: |
          set -euo pipefail
          bash .github/scripts/recover-transient-opencode.sh
