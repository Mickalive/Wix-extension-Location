name: Wix Autonomous Recovery Watchdog

on:
  workflow_run:
    workflows: ["Wix Autonomous Product Factory"]
    types: [completed]
  workflow_dispatch: {}
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: wix-recovery-watchdog-v5
  cancel-in-progress: true

env:
  FACTORY_WORKFLOW: wix-build-loop.yml
  LANE_BRANCH: lab/wix-rules
  EXPECTED_WIX_APP_ID: 3e9ec3af-001b-4684-a197-a5133677844d

jobs:
  recover:
    name: Ensure product progression
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Recover or continue until READY
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          read_file() {
            local path="$1"
            gh api "repos/$repo/contents/$path?ref=$LANE_BRANCH" --jq '.content' 2>/dev/null \
              | tr -d '\n' | base64 -d 2>/dev/null || true
          }

          state="$(read_file docs/state.json)"
          [[ -n "$state" ]] || state='{}'
          cycle="$(jq -r '.cycle // 0' <<<"$state")"
          [[ "$cycle" =~ ^[0-9]+$ ]] || cycle=0

          ready="$(read_file reports/release/READY.json)"
          if [[ -n "$ready" ]] \
             && [[ "$(jq -r '.verdict // empty' <<<"$ready")" == READY ]] \
             && [[ "$(jq -r '.app_id // empty' <<<"$ready")" == "$EXPECTED_WIX_APP_ID" ]]; then
            echo "READY is proven for the bound Wix app. No recovery action needed."
            exit 0
          fi

          runs="$(gh run list --repo "$repo" --workflow "$FACTORY_WORKFLOW" --limit 30 \
            --json databaseId,status,conclusion,createdAt,updatedAt,url 2>/dev/null || echo '[]')"

          active="$(jq -c '[.[] | select(.status != "completed")] | sort_by(.createdAt) | last // empty' <<<"$runs")"
          if [[ -n "$active" ]]; then
            run_id="$(jq -r '.databaseId' <<<"$active")"
            status="$(jq -r '.status' <<<"$active")"
            created="$(jq -r '.createdAt' <<<"$active")"
            now="$(date -u +%s)"
            created_epoch="$(date -u -d "$created" +%s 2>/dev/null || echo "$now")"
            age=$((now - created_epoch))

            jobs="$(gh api "repos/$repo/actions/runs/$run_id/jobs?filter=latest&per_page=100" 2>/dev/null || echo '{"jobs":[]}')"
            count="$(jq '(.jobs // []) | length' <<<"$jobs")"
            running="$(jq '[.jobs[]? | select(.status == "in_progress")] | length' <<<"$jobs")"
            queued="$(jq '[.jobs[]? | select(.status == "queued" or .status == "pending")] | length' <<<"$jobs")"

            if (( age > 900 && count == 0 )); then
              echo "Factory $run_id is a scheduler zombie: $status for ${age}s with zero jobs."
              gh api --method POST "repos/$repo/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
            elif (( age > 1800 && running == 0 && queued > 0 )); then
              echo "Factory $run_id is queue-stalled: ${age}s, queued=$queued, running=0."
              gh api --method POST "repos/$repo/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
            else
              echo "Factory $run_id is active ($status); watchdog leaves it alone."
              exit 0
            fi
          fi

          sleep 5
          active_count="$(gh run list --repo "$repo" --workflow "$FACTORY_WORKFLOW" --limit 20 \
            --json status --jq '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)"
          if [[ "$active_count" =~ ^[0-9]+$ ]] && (( active_count > 0 )); then
            echo "A Product Factory is active after recovery; no duplicate dispatched."
            exit 0
          fi

          next=$((cycle + 1))
          last="$(jq -c '[.[] | select(.status == "completed")] | sort_by(.createdAt) | last // {}' <<<"$runs")"
          last_id="$(jq -r '.databaseId // 0' <<<"$last")"
          last_conclusion="$(jq -r '.conclusion // "none"' <<<"$last")"
          note="WATCHDOG RECOVERY. READY is not proven. Previous factory run=${last_id}, conclusion=${last_conclusion}. Start a fresh cycle from the current accepted lab/wix-rules state. Preserve accepted progress. Diagnose current evidence, repair any product or orchestration-visible defect through the owning lane, then continue through lane audit, integrated simulation/audit, authenticated Wix build/dev-site/MCP QA and independent release audit. Do not stop for NOT_READY, BLOCKED_EXTERNAL, stagnation, max cycles, or provider outages; recheck/repair and continue."

          gh workflow run "$FACTORY_WORKFLOW" --repo "$repo" --ref main \
            -f cycle_index="$next" \
            -f recovery_note="$note"
          echo "Dispatched fresh Product Factory cycle $next."

      - name: Best-effort garbage collection
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          repo="$GITHUB_REPOSITORY"
          active_ids="$(gh run list --repo "$repo" --workflow "$FACTORY_WORKFLOW" --limit 20 \
            --json databaseId,status --jq '[.[] | select(.status != "completed") | (.databaseId|tostring)] | join(" ")' 2>/dev/null)"

          git ls-remote --heads "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" \
            'refs/heads/cycle/wix-build/*' 'refs/heads/qa/wix-sim/*' 2>/dev/null \
            | awk '{print $2}' | sed 's#refs/heads/##' | while read -r branch; do
                [[ -n "$branch" ]] || continue
                keep=false
                for id in $active_ids; do
                  [[ "$branch" == cycle/wix-build/"$id"/* ]] && keep=true
                done
                if [[ "$keep" == false ]]; then
                  git push "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" --delete "$branch" >/dev/null 2>&1 || true
                fi
              done

          gh run list --repo "$repo" --limit 100 \
            --json databaseId,status,workflowName,createdAt \
            --jq '.[] | select(.status == "completed") | [.databaseId,.workflowName,.createdAt] | @tsv' 2>/dev/null \
            | awk 'NR>30 {print $1}' | while read -r id; do
                [[ "$id" == "$GITHUB_RUN_ID" ]] && continue
                gh api --method DELETE "repos/$repo/actions/runs/$id" >/dev/null 2>&1 || true
              done
