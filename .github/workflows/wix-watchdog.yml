name: Wix Autonomous Recovery Watchdog
# Persistent product supervisor: READY is the only normal terminal state.
# Everything else is retried, repaired, escalated, or safely rechecked every 5 minutes.

on:
  push:
    branches: [main]
    paths: [".github/workflows/wix-watchdog.yml", ".github/scripts/recover-transient-opencode.sh"]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: wix-autonomous-recovery-supervisor-v3
  cancel-in-progress: true

jobs:
  supervise:
    name: Persistent autonomous supervisor — 5 minute heartbeat
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 1
          ref: main
          persist-credentials: false

      - name: Retire superseded watchdog runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          current="$GITHUB_RUN_ID"
          gh run list --repo "$repo" --workflow wix-watchdog.yml --limit 30 \
            --json databaseId,status,createdAt \
            | jq -r --arg current "$current" '.[] | select((.status != "completed") and ((.databaseId|tostring) != $current)) | .databaseId' \
            | while read -r id; do
                [[ -z "$id" ]] && continue
                echo "Cancelling superseded watchdog run $id"
                gh api --method POST "repos/$repo/actions/runs/$id/cancel" >/dev/null 2>&1 || true
              done

      - name: Prune obsolete completed Actions evidence
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          runs=$(gh api --paginate "repos/$repo/actions/runs?per_page=100" --jq '.workflow_runs[]' | jq -s '.')
          keep_file=$(mktemp)
          trap 'rm -f "$keep_file"' EXIT

          jq -r '.[] | select(.status != "completed") | .id' <<<"$runs" >> "$keep_file"
          keep_latest() {
            local path="$1" count="$2"
            jq -r --arg p "$path" --argjson n "$count" \
              '[.[] | select(.path == $p and .status == "completed")] | sort_by(.created_at) | reverse | .[:$n] | .[].id' \
              <<<"$runs" >> "$keep_file"
          }
          keep_latest '.github/workflows/wix-build-loop.yml' 3
          keep_latest '.github/workflows/ci.yml' 1
          keep_latest '.github/workflows/wix-sim.yml' 1
          keep_latest '.github/workflows/wix-watchdog.yml' 3
          sort -u "$keep_file" -o "$keep_file"

          while IFS=$'\t' read -r id status path name conclusion; do
            if grep -qx "$id" "$keep_file" || [[ "$status" != completed ]]; then continue; fi
            echo "Deleting obsolete run $id | $name | $conclusion | $path"
            gh api --method DELETE "repos/$repo/actions/runs/$id" >/dev/null 2>&1 || true
          done < <(jq -r '.[] | [.id,.status,.path,.name,(.conclusion // "")] | @tsv' <<<"$runs")

      - name: Inspect and heal Product Factory every five minutes
        env:
          GH_TOKEN: ${{ github.token }}
          WIX_LOOP_WORKFLOW: wix-build-loop.yml
        shell: bash
        run: |
          set -u -o pipefail
          rm -f /tmp/wix-product-ready
          for tick in $(seq 1 70); do
            echo "=== autonomous supervisor tick $tick/70 at $(date -u +%FT%TZ) ==="

            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch origin main --quiet || true
            if git show origin/main:.github/scripts/recover-transient-opencode.sh > /tmp/recover.sh 2>/dev/null; then
              chmod +x /tmp/recover.sh
              set +e
              bash /tmp/recover.sh
              rc=$?
              set -e
              if (( rc == 10 )); then
                echo "READY release evidence confirmed. Supervisor terminal condition reached."
                touch /tmp/wix-product-ready
                break
              elif (( rc != 0 )); then
                echo "::warning::Recovery router returned $rc; supervisor remains alive and will inspect again."
              fi
            else
              echo "::warning::Could not refresh recovery router; supervisor remains alive."
            fi

            if (( tick < 70 )); then sleep 300; fi
          done

      - name: Hand off before runner timeout unless READY
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/wix-product-ready ]]; then
            echo "Product READY: no further watchdog handoff required."
            exit 0
          fi
          gh workflow run wix-watchdog.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Fresh autonomous supervisor dispatched before runner timeout."
