name: Wix Autonomous Recovery Watchdog
# Persistent self-healing supervisor. It stays alive and inspects the Factory every 5 minutes.
# GitHub schedule is only a fallback heartbeat; autonomy does not depend on cron punctuality.

on:
  push:
    branches: [main]
    paths: [".github/workflows/wix-watchdog.yml", ".github/scripts/recover-transient-opencode.sh"]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: wix-autonomous-recovery-watchdog
  cancel-in-progress: true

jobs:
  cleanup:
    name: Prune obsolete Actions history
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Keep only current evidence-bearing Actions runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          runs=$(gh api --paginate "repos/$repo/actions/runs?per_page=100" --jq '.workflow_runs[]' | jq -s '.')
          keep_file=$(mktemp)
          trap 'rm -f "$keep_file"' EXIT

          jq -r '.[] | select(.status != "completed") | .id' <<<"$runs" >> "$keep_file"

          keep_latest() {
            local path="$1" count="$2"
            local active
            active=$(jq --arg p "$path" '[.[] | select(.path == $p and .status != "completed")] | length' <<<"$runs")
            if (( active > 0 )); then
              return
            fi
            jq -r --arg p "$path" --argjson n "$count" \
              '[.[] | select(.path == $p and .status == "completed")] | sort_by(.created_at) | reverse | .[:$n] | .[].id' \
              <<<"$runs" >> "$keep_file"
          }

          keep_latest '.github/workflows/wix-build-loop.yml' 2
          keep_latest '.github/workflows/ci.yml' 1
          keep_latest '.github/workflows/wix-sim.yml' 1
          keep_latest '.github/workflows/wix-watchdog.yml' 2

          sort -u "$keep_file" -o "$keep_file"
          deleted=0
          kept=0
          while IFS=$'\t' read -r id status path name conclusion; do
            if grep -qx "$id" "$keep_file" || [[ "$status" != completed ]]; then
              kept=$((kept+1))
              continue
            fi
            echo "Deleting obsolete run $id | $name | $conclusion | $path"
            gh api --method DELETE "repos/$repo/actions/runs/$id"
            deleted=$((deleted+1))
          done < <(jq -r '.[] | [.id,.status,.path,.name,(.conclusion // "")] | @tsv' <<<"$runs")

          echo "Deleted obsolete runs: $deleted"
          echo "Preserved runs: $kept"

  launch:
    name: Launch Product Factory from accepted state
    if: ${{ github.event_name == 'push' }}
    needs: cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout accepted product state
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 1
          ref: lab/wix-rules
          persist-credentials: false
      - name: Dispatch only if no Factory is already active
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow wix-build-loop.yml --limit 20 --json status | jq '[.[] | select(.status != "completed")] | length')
          if (( active > 0 )); then
            echo "Product Factory already active; no duplicate dispatch."
            exit 0
          fi
          current=$(jq -r '.cycle // 0' docs/state.json)
          [[ "$current" =~ ^[0-9]+$ ]]
          next=$((current + 1))
          gh workflow run wix-build-loop.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f cycle_index="$next" \
            -f max_cycles="0" \
            -f human_note=""
          echo "Dispatched Product Factory cycle $next from accepted state."

  supervise:
    name: Persistent autonomous supervisor — 5 minute heartbeat
    needs: [cleanup, launch]
    if: ${{ always() && github.repository == 'Mickalive/Wix-extension-Location' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 1
          ref: main
          persist-credentials: false
      - name: Inspect and heal the Factory every five minutes
        env:
          GH_TOKEN: ${{ github.token }}
          WIX_LOOP_WORKFLOW: wix-build-loop.yml
        shell: bash
        run: |
          set -u -o pipefail
          for tick in $(seq 1 70); do
            echo "=== autonomous supervisor tick $tick/70 at $(date -u +%FT%TZ) ==="

            # Refresh the reviewed recovery logic so a long-lived supervisor adopts safe fixes on main.
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch origin main --quiet || true
            if git show origin/main:.github/scripts/recover-transient-opencode.sh > /tmp/recover.sh 2>/dev/null; then
              chmod +x /tmp/recover.sh
              if ! bash /tmp/recover.sh; then
                rc=$?
                echo "::warning::Recovery router returned $rc; supervisor remains alive and will inspect again."
              fi
            else
              echo "::warning::Could not refresh recovery router; supervisor remains alive."
            fi

            if (( tick < 70 )); then
              sleep 300
            fi
          done
      - name: Hand off to a fresh supervisor before runner timeout
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run wix-watchdog.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Fresh autonomous supervisor dispatched."
